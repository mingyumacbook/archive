:root{--bg:#fff;--ink:#0d0d0d;--ink-2:#5c5c5c;--ink-3:#9a9a9a;--line:#e7e7e7;--soft:#f5f5f4;--alert:#a8231a;--ok:#2f6f45;--warn:#9a6a00;
 --f-mark:"VD Mark","Palatino Linotype",Palatino,Georgia,serif;--f-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.draftbar{position:sticky;top:0;z-index:50;background:#111;color:#fff;font-size:12.5px;display:flex;gap:14px;align-items:center;justify-content:center;padding:9px 16px;flex-wrap:wrap}
.draftbar .seg{display:inline-flex;border:1px solid #555}.draftbar .seg button{background:none;border:0;color:#bbb;padding:5px 12px}.draftbar .seg button.on{background:#fff;color:#111}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}.mark{font-family:var(--f-mark);font-size:20px;letter-spacing:.01em}
.hd small{font-size:11.5px;letter-spacing:.08em;color:var(--ink-2)}
.hero{height:min(58vh,520px);background:linear-gradient(160deg,#2b2a28,#0e0e0e);color:#fff;display:flex;align-items:flex-end;padding:40px 24px}
.hero h1{font-family:var(--f-mark);font-weight:400;font-size:clamp(26px,3.4vw,44px);line-height:1.1;margin:0;max-width:560px}
.wrap{max-width:1200px;margin:0 auto;padding:40px 24px 120px}.wrap h2{font-family:var(--f-mark);font-weight:400;font-size:30px;margin:0 0 16px}
.ph{height:18px;background:var(--soft);margin:12px 0;width:80%}.ph.s{width:55%}
.note{max-width:1200px;margin:0 auto;padding:0 24px;font-size:13px;color:var(--ink-2);line-height:1.7}
/* ---- chat launcher ---- */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:40;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.22);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}.fab svg{width:24px;height:24px}
.fab .bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--alert);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid #fff}
/* ---- panel ---- */
.panel{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:88px;z-index:41;width:min(380px,calc(100vw - 32px));height:min(620px,calc(100vh - 120px));background:var(--bg);border:1px solid var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s ease}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.panel.wide{width:min(760px,calc(100vw - 32px))}
.ph1{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph1 .t{flex:1;min-width:0}.ph1 b{display:block;font-family:var(--f-mark);font-weight:400;font-size:19px;line-height:1.1}.ph1 small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.ib{border:0;background:none;padding:6px;line-height:0;color:var(--ink)}.ib svg{width:18px;height:18px}
.body{flex:1;overflow:auto;min-height:0}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
/* home */
.home{padding:18px 16px;display:grid;gap:18px}
.hello{font-family:var(--f-mark);font-size:24px;line-height:1.25}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{border:1px solid var(--line);background:none;text-align:left;padding:12px;display:grid;gap:4px}.cat:hover{border-color:var(--ink)}.cat b{font-weight:500;font-size:13.5px}.cat span{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.tl{display:grid}.ti{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.ti:last-child{border-bottom:1px solid var(--line)}.ti b{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti small{font-size:11px;color:var(--ink-3);text-align:right}
.ti p{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .meta{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.tag{font-size:10.5px;border:1px solid var(--line);padding:1px 7px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
.st-open{border-color:var(--ink);color:var(--ink)}.st-doing{border-color:var(--warn);color:var(--warn)}.st-done{border-color:var(--ok);color:var(--ok)}
.unr{width:7px;height:7px;border-radius:50%;background:var(--alert);display:inline-block}
/* thread */
.th{display:flex;flex-direction:column;height:100%}
.thh{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.day{align-self:center;font-size:11px;color:var(--ink-3);margin:4px 0}
.m{max-width:82%;display:grid;gap:3px}.m .bb{padding:10px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;justify-items:end}.m.me .bb{background:var(--ink);color:#fff}
.m.them{align-self:flex-start}.m.them .bb{background:#fff;border:1px solid var(--line)}
.m small{font-size:10.5px;color:var(--ink-3)}.m .who{font-size:11px;color:var(--ink-2)}
.m img{max-width:220px;display:block;border:1px solid var(--line)}
.sys{align-self:center;font-size:11.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.comp{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end;background:var(--bg)}
.comp textarea{resize:none;border:1px solid var(--line);padding:9px 10px;min-height:40px;max-height:120px;font-size:13.5px;outline:none}.comp textarea:focus{border-color:var(--ink)}
.send{border:0;background:var(--ink);color:#fff;height:40px;padding:0 14px;font-size:12.5px;letter-spacing:.04em}
.att{border:1px solid var(--line);background:none;height:40px;width:40px;display:grid;place-items:center}.att svg{width:16px;height:16px}
.prev{grid-column:1/-1;display:flex;gap:6px}.prev img{height:46px;border:1px solid var(--line)}
/* admin */
.adm{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%}
.adm .side{border-right:1px solid var(--line);overflow:auto;min-height:0}
.flt{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.flt button{border:1px solid var(--line);background:none;padding:3px 9px;font-size:11.5px;border-radius:999px;color:var(--ink-2)}.flt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.adm .ti{padding:12px}
.adm .ti.sel{background:var(--soft)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:13px}
select.stsel{border:1px solid var(--line);background:none;padding:4px 8px;font-size:12px}
.new{display:grid;gap:10px;padding:16px}
.new textarea{border:1px solid var(--line);padding:10px;min-height:120px;resize:vertical;font-size:13.5px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 14px;font-size:12.5px;letter-spacing:.04em}.btn.ghost{background:none;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:none;padding:5px 11px;border-radius:999px;font-size:12px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:640px){.panel{right:0;left:0;bottom:0;width:100%;height:calc(100dvh - 78px);border:0;border-top:1px solid var(--ink)}.panel.wide{width:100%}.adm{grid-template-columns:1fr}.adm.open .side{display:none}.adm:not(.open) .main{display:none}.fab.hide{display:none}}
</style></head><body>

<section class="hero"><h1>오른쪽 아래 버튼을 눌러 문의 채팅을 열어보세요</h1></section>
<div class="wrap"><h2>News</h2><div class="ph"></div><div class="ph s"></div><div class="ph"></div><div class="ph s"></div></div>
<p class="note">이 페이지는 화면과 흐름을 보기 위한 초안이라 메시지는 이 브라우저에만 임시로 저장돼요. 실제 앱에 넣을 때는 계정과 연결해 관리자(나)와 각 사용자만 대화를 볼 수 있게 만들어요.</p>
<button class="fab" id="fab" aria-label="문의하기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="bd" id="bd" hidden></span></button>
<section class="panel" id="panel" role="dialog" aria-label="문의"></section>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=[["bug","오류 신고","잘 안 되거나 이상한 부분"],["idea","기능 제안","추가됐으면 하는 기능 · 시스템"],["remove","빼도 될 기능","잘 안 쓰거나 불필요한 기능"],["etc","기타 문의","그 밖의 모든 이야기"]];
const ST={open:["접수","st-open"],doing:["확인 중","st-doing"],done:["반영 완료","st-done"]};
const ME={user:{id:"u2",name:"김서연"},admin:{id:"admin",name:"전민규"}};
const now=Date.now(),H=36e5;
const SEED=[
 {id:"t1",uid:"u2",uname:"김서연",cat:"bug",status:"doing",title:"시즌 리포트 남성복 컬러가 안 보여요",at:now-26*H,readU:now,readA:now-25*H,msgs:[
   {from:"u2",text:"시즌 리포트에서 남성 탭을 누르면 컬러 막대가 비어 있어요. 아이폰 사파리예요.",at:now-26*H},
   {from:"admin",text:"알려줘서 고마워요! 확인해 보니 FW26 남성복 데이터가 늦게 들어오고 있었어요. 오늘 안에 고칠게요.",at:now-25*H},
   {sys:"상태가 '확인 중'으로 바뀌었어요",at:now-25*H}]},
 {id:"t2",uid:"u2",uname:"김서연",cat:"idea",status:"open",title:"아카이브 폴더를 다른 사람과 공유하고 싶어요",at:now-3*H,readU:now,readA:0,msgs:[
   {from:"u2",text:"팀원이랑 같은 무드보드 폴더를 같이 보면서 쓸 수 있으면 좋겠어요.",at:now-3*H}]},
 {id:"t3",uid:"u3",uname:"박지훈",cat:"remove",status:"done",title:"캘린더 알림 바가 너무 자주 떠요",at:now-72*H,readU:now,readA:now,msgs:[
   {from:"u3",text:"쇼 기간에 맨 위 알림 바가 매번 떠서 조금 번거로워요.",at:now-72*H},{from:"admin",text:"한 번 닫으면 그날은 다시 안 뜨게 바꿨어요!",at:now-50*H},{sys:"상태가 '반영 완료'로 바뀌었어요",at:now-50*H}]}
];
let DB;try{DB=JSON.parse(localStorage.getItem("vdChatDraft"))}catch(_){}if(!DB)DB=JSON.parse(JSON.stringify(SEED));
const save=()=>{try{localStorage.setItem("vdChatDraft",JSON.stringify(DB))}catch(_){}};
let role="user",view="home",cur=null,newCat=null,afilter="all",pendingImg=null;
const fmt=t=>{const d=new Date(t),td=new Date();return d.toDateString()===td.toDateString()?d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):`${d.getMonth()+1}.${d.getDate()}`};
const catName=c=>(CATS.find(x=>x[0]===c)||[,"기타"])[1];
const mine=()=>DB.filter(t=>t.uid===ME.user.id).sort((a,b)=>last(b)-last(a));
const last=t=>t.msgs.length?t.msgs[t.msgs.length-1].at:t.at;
const unreadU=t=>t.msgs.some(m=>m.from==="admin"&&m.at>t.readU);const unreadA=t=>t.msgs.some(m=>m.from&&m.from!=="admin"&&m.at>t.readA);
function badge(){const n=role==="user"?mine().filter(unreadU).length:DB.filter(unreadA).length;const b=$("#bd");b.hidden=!n;b.textContent=n}
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>',BK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>',CL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/></svg>';
function head(title,sub,back){return `<div class="ph1">${back?`<button class="ib" data-back aria-label="뒤로">${BK}</button>`:""}<div class="t"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:""}</div><button class="ib" data-close aria-label="닫기">${X}</button></div>`}
function msgsHtml(t,meId){let out="",lastDay="";t.msgs.forEach(m=>{const day=new Date(m.at).toLocaleDateString("ko-KR",{month:"long",day:"numeric"});if(day!==lastDay){out+=`<div class="day">${day}</div>`;lastDay=day}
  if(m.sys){out+=`<div class="sys">${esc(m.sys)}</div>`;return}const me=m.from===meId;const who=m.from==="admin"?"VISUAL DEPT.":t.uname;
  out+=`<div class="m ${me?"me":"them"}">${!me?`<span class="who">${esc(who)}</span>`:""}${m.img?`<img src="${m.img}" alt="첨부 이미지">`:""}${m.text?`<div class="bb">${esc(m.text)}</div>`:""}<small>${fmt(m.at)}</small></div>`});return out}
function composer(){return `<form class="comp" id="comp">${pendingImg?`<div class="prev"><img src="${pendingImg}" alt=""><button type="button" class="ib" id="rmImg" aria-label="첨부 빼기">${X}</button></div>`:""}<label class="att" title="스크린샷 첨부">${CL}<input type="file" id="img" accept="image/*" hidden></label><textarea id="txt" rows="1" placeholder="메시지를 입력하세요"></textarea><button class="send">보내기</button></form>`}
function render(){const p=$("#panel");p.classList.toggle("wide",role==="admin");
  if(role==="user"){
    if(view==="home"){const L=mine();p.innerHTML=head("문의하기","보통 하루 안에 답장해요")+`<div class="body"><div class="home"><div class="hello">안녕하세요, ${esc(ME.user.name)}님.<br>무엇이든 편하게 남겨 주세요.</div>
      <div><span class="lbl">새 문의</span><div class="cats" style="margin-top:8px">${CATS.map(([k,n,d])=>`<button class="cat" data-new="${k}"><b>${n}</b><span>${d}</span></button>`).join("")}</div></div>
      <div><span class="lbl">내 문의 ${L.length}</span><div class="tl" style="margin-top:6px">${L.length?L.map(t=>`<button class="ti" data-open="${t.id}"><b>${unreadU(t)?'<span class="unr"></span> ':""}${esc(t.title)}</b><small>${fmt(last(t))}</small><p>${esc((t.msgs.filter(m=>!m.sys).slice(-1)[0]||{}).text||"이미지")}</p><span class="meta"><span class="tag">${catName(t.cat)}</span><span class="tag ${ST[t.status][1]}">${ST[t.status][0]}</span></span></button>`).join(""):`<div class="empty">아직 남긴 문의가 없어요</div>`}</div></div></div></div>`}
    else if(view==="new"){p.innerHTML=head(catName(newCat),"관리자에게 바로 전달돼요",true)+`<div class="body"><form class="new" id="newf"><div class="chips">${CATS.map(([k,n])=>`<button type="button" class="chip ${k===newCat?"on":""}" data-pick="${k}">${n}</button>`).join("")}</div>
      <input id="ntitle" placeholder="한 줄 요약 (예: 캘린더가 안 열려요)" style="border:1px solid var(--line);padding:10px;font-size:13.5px" required>
      <textarea id="nbody" placeholder="${newCat==="bug"?"어느 화면에서, 무엇을 눌렀을 때, 어떻게 되는지 적어 주세요. 스크린샷이 있으면 아래에서 첨부할 수 있어요.":newCat==="idea"?"어떤 기능이 있으면 좋을지, 왜 필요한지 편하게 적어 주세요.":newCat==="remove"?"어떤 기능이 불필요한지, 이유를 알려 주세요.":"자유롭게 적어 주세요."}" required></textarea>
      <label class="btn ghost" style="text-align:center;cursor:pointer">스크린샷 첨부 <input type="file" id="nimg" accept="image/*" hidden></label>${pendingImg?`<div class="prev"><img src="${pendingImg}" alt=""></div>`:""}<button class="btn">보내기</button></form></div>`}
    else{const t=DB.find(x=>x.id===cur);t.readU=Date.now();save();p.innerHTML=head(t.title,`${catName(t.cat)} · ${ST[t.status][0]}`,true)+`<div class="th body" style="display:flex"><div class="msgs" id="msgs">${msgsHtml(t,ME.user.id)}</div>${composer()}</div>`}
  }else{
    const L=DB.filter(t=>afilter==="all"||(afilter==="unread"?unreadA(t):t.status===afilter||t.cat===afilter)).sort((a,b)=>last(b)-last(a));const t=cur&&DB.find(x=>x.id===cur);if(t){t.readA=Date.now();save()}
    p.innerHTML=head("문의함 · 관리자",`전체 ${DB.length}건 · 안 읽음 ${DB.filter(unreadA).length}건`)+`<div class="body" style="overflow:hidden"><div class="adm ${t?"open":""}"><div class="side"><div class="flt">${[["all","전체"],["unread","안 읽음"],["open","접수"],["doing","확인 중"],["done","반영 완료"],["bug","오류"],["idea","제안"],["remove","빼기"]].map(([k,n])=>`<button data-af="${k}" class="${afilter===k?"on":""}">${n}</button>`).join("")}</div>
      ${L.length?L.map(x=>`<button class="ti ${x.id===cur?"sel":""}" data-open="${x.id}"><b>${unreadA(x)?'<span class="unr"></span> ':""}${esc(x.uname)} · ${esc(x.title)}</b><small>${fmt(last(x))}</small><p>${esc((x.msgs.filter(m=>!m.sys).slice(-1)[0]||{}).text||"이미지")}</p><span class="meta"><span class="tag">${catName(x.cat)}</span><span class="tag ${ST[x.status][1]}">${ST[x.status][0]}</span></span></button>`).join(""):`<div class="empty">해당하는 문의가 없어요</div>`}</div>
      <div class="main" style="min-height:0">${t?`<div class="th"><div class="thh"><button class="ib" data-back aria-label="목록">${BK}</button><b style="font-weight:500;font-size:13.5px;flex:1;min-width:0">${esc(t.uname)} · ${esc(t.title)}</b><select class="stsel" id="stsel">${Object.entries(ST).map(([k,[n]])=>`<option value="${k}" ${t.status===k?"selected":""}>${n}</option>`).join("")}</select></div><div class="msgs" id="msgs">${msgsHtml(t,"admin")}</div>${composer()}</div>`:`<div class="empty" style="padding-top:120px">왼쪽에서 문의를 골라 주세요</div>`}</div></div></div>`}
  const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight;badge()}
function send(text){const t=DB.find(x=>x.id===cur);if(!t||(!text&&!pendingImg))return;const from=role==="user"?ME.user.id:"admin";t.msgs.push({from,text,img:pendingImg||undefined,at:Date.now()});pendingImg=null;if(role==="admin"&&t.status==="open"){t.status="doing";t.msgs.push({sys:"상태가 '확인 중'으로 바뀌었어요",at:Date.now()})}save();render();
  if(role==="user"&&t.msgs.filter(m=>m.from==="admin").length===0&&!t._auto){t._auto=1;setTimeout(()=>{t.msgs.push({sys:"접수됐어요. 관리자가 확인하면 여기로 답장이 와요",at:Date.now()});save();render()},600)}}
const readImg=(f,cb)=>{if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(f)};
document.addEventListener("click",e=>{const g=e.target;
  if(g.closest("#fab")){$("#panel").classList.toggle("on");$("#fab").classList.toggle("hide",$("#panel").classList.contains("on"));render();return}
  if(g.closest("[data-close]")){$("#panel").classList.remove("on");$("#fab").classList.remove("hide");return}
  if(g.closest("[data-back]")){view="home";cur=null;pendingImg=null;render();return}
  const nw=g.closest("[data-new]");if(nw){newCat=nw.dataset.new;view="new";pendingImg=null;render();return}
  const pk=g.closest("[data-pick]");if(pk){newCat=pk.dataset.pick;const v=[$("#ntitle").value,$("#nbody").value];render();$("#ntitle").value=v[0];$("#nbody").value=v[1];return}
  const op=g.closest("[data-open]");if(op){cur=op.dataset.open;view="thread";pendingImg=null;render();return}
  const af=g.closest("[data-af]");if(af){afilter=af.dataset.af;render();return}
  if(g.closest("#rmImg")){pendingImg=null;render();return}
  const rb=g.closest("[data-role]");if(rb){role=rb.dataset.role;document.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("on",b===rb));view="home";cur=null;render();return}
  if(g.closest("#reset")){DB=JSON.parse(JSON.stringify(SEED));save();view="home";cur=null;render()}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="comp"){send($("#txt").value.trim())}
  if(e.target.id==="newf"){const id="t"+Date.now();DB.push({id,uid:ME.user.id,uname:ME.user.name,cat:newCat,status:"open",title:$("#ntitle").value.trim(),at:Date.now(),readU:Date.now(),readA:0,msgs:[{from:ME.user.id,text:$("#nbody").value.trim(),img:pendingImg||undefined,at:Date.now()}]});pendingImg=null;save();cur=id;view="thread";render();
    setTimeout(()=>{const t=DB.find(x=>x.id===id);t.msgs.push({sys:"접수됐어요. 관리자가 확인하면 여기로 답장이 와요",at:Date.now()});save();render()},500)}});
document.addEventListener("change",e=>{if(e.target.id==="img"||e.target.id==="nimg"){const keep=e.target.id==="nimg"?[$("#ntitle").value,$("#nbody").value]:null;readImg(e.target.files[0],u=>{pendingImg=u;render();if(keep){$("#ntitle").value=keep[0];$("#nbody").value=keep[1]}})}
  if(e.target.id==="stsel"){const t=DB.find(x=>x.id===cur);t.status=e.target.value;t.msgs.push({sys:`상태가 '${ST[t.status][0]}'(으)로 바뀌었어요`,at:Date.now()});save();render()}});
document.addEventListener("keydown",e=>{if(e.target.id==="txt"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(e.target.value.trim())}});
badge();
</script></body></html>
