:root{--bg:#fff;--ink:#0d0d0d;--ink-2:#5c5c5c;--ink-3:#9a9a9a;--line:#e6e6e5;--soft:#f1f1f0;--bub:#ececeb;--alert:#c8102e;
 --f-mark:"VD Mark","Palatino Linotype",Palatino,Georgia,serif;--f-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.draftbar{position:sticky;top:0;z-index:60;background:#111;color:#fff;font-size:12.5px;display:flex;gap:14px;align-items:center;justify-content:center;padding:9px 16px;flex-wrap:wrap}
.draftbar .seg{display:inline-flex;border:1px solid #555}.draftbar .seg button{background:none;border:0;color:#bbb;padding:5px 12px}.draftbar .seg button.on{background:#fff;color:#111}
.draftbar .rs{background:none;border:0;color:#bbb;text-decoration:underline;text-underline-offset:3px}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}.mark{font-family:var(--f-mark);font-size:20px}
.hd small{font-size:11.5px;letter-spacing:.08em;color:var(--ink-2)}
.hero{height:min(58vh,520px);background:linear-gradient(160deg,#cfcac2,#7d776e 55%,#2a2826);color:#fff;display:flex;align-items:flex-end;padding:40px 24px}
.hero h1{font-family:var(--f-mark);font-weight:400;font-size:clamp(26px,3.4vw,44px);line-height:1.1;margin:0;max-width:600px}
.hero h1 span{font-family:var(--f-ui);font-weight:300}
.news{padding:36px 24px;max-width:1100px}.news h2{font-family:var(--f-mark);font-weight:400;font-size:26px;margin:0 0 18px}
.sk{height:12px;background:var(--soft);margin:12px 0}.sk.w6{width:60%}.sk.w8{width:80%}.sk.w4{width:40%}


/* ---------- chat button: translucent speech bubble only ---------- */
.fab{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:45;width:64px;height:58px;border:0;background:none;padding:0;transition:transform .2s}
.fab:active{transform:scale(.93)}
.fab>*{position:absolute;inset:0;width:64px;height:58px}
.fab .shd{fill:rgba(0,0,0,.2);filter:blur(7px);transform:translateY(5px)}
.fab .glass{clip-path:path("M32 2C15 2 2 12.6 2 25.6c0 7.6 4.3 14.2 11 18.6-.6 4.4-2.8 8.2-6.4 10.8 6.8 0 12.6-2.4 16.6-6 2.8.5 5.7.8 8.8.8 17 0 30-10.8 30-24S49 2 32 2z");background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8)}
.fab .rim path{fill:url(#gl);stroke:rgba(0,0,0,.16);stroke-width:1}
.fab .ix{left:23px;top:16px;width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;opacity:0;transform:rotate(-45deg) scale(.6);transition:.25s}
.fab.open .ix{opacity:1;transform:none}
.fab .bd{inset:auto;top:-5px;right:-5px;width:auto;height:20px;min-width:20px;padding:0 6px;border-radius:10px;background:var(--alert);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.fab .bd:empty{display:none}
/* ---------- panel ---------- */
.panel{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:96px;z-index:44;width:384px;height:min(640px,calc(100vh - 150px));background:#fff;border-radius:22px;overflow:hidden;
 box-shadow:0 30px 80px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.08);display:flex;flex-direction:column;opacity:0;transform:translateY(14px) scale(.98);transform-origin:100% 100%;pointer-events:none;transition:opacity .2s,transform .22s}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.panel.wide{width:min(860px,calc(100vw - 48px));height:min(680px,calc(100vh - 150px))}
.split{display:flex;flex:1;min-height:0}.side{width:310px;flex:none;border-right:.5px solid var(--line);display:flex;flex-direction:column;min-height:0}.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.ch{position:relative;text-align:center;padding:14px 48px 10px;background:rgba(248,248,247,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--line);flex:none}
.ch .nm{display:block;font-size:12.5px;font-weight:500;margin-top:5px}.ch small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.ibtn{position:absolute;top:12px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;padding:0}.ibtn:hover{background:var(--soft)}
.ibtn svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.7}.x{right:12px}.bk{left:10px}
.av{width:42px;height:42px;border-radius:50%;margin:0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:500;letter-spacing:.02em;background:linear-gradient(#b4b4b2,#8d8d8b);flex:none}
.av.vd{background:var(--ink);font-family:var(--f-mark);font-weight:400;font-size:15px;letter-spacing:.04em}
.av.s{width:44px;height:44px;margin:0}.av.big{width:64px;height:64px;font-size:21px}
.seg2{display:flex;margin:10px 14px 4px;background:var(--soft);border-radius:9px;padding:2px;flex:none}
.seg2 button{flex:1;border:0;background:none;border-radius:7px;padding:6px 0;font-size:13px;color:var(--ink-2)}.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg2 i{font-style:normal;font-size:11px;background:var(--ink);color:#fff;border-radius:8px;padding:0 6px;margin-left:3px}

/* messages */
.msgs{flex:1;overflow:auto;padding:6px 14px 10px;display:flex;flex-direction:column;overscroll-behavior:contain}
.intro{text-align:center;color:var(--ink-3);font-size:12px;line-height:1.6;padding:14px 18px 4px}
.intro b{color:var(--ink-2);font-weight:500}
.ts{align-self:center;font-size:11px;color:var(--ink-3);margin:16px 0 6px}.ts b{font-weight:600}
.sys{align-self:center;max-width:86%;text-align:center;font-size:11.5px;color:var(--ink-2);margin:10px 0 4px;line-height:1.5}
.sys em{font-style:normal;border-bottom:1px solid currentColor}
.row{display:flex;flex-direction:column;align-items:flex-start;margin-top:2px}.row.me{align-items:flex-end}.row.gap{margin-top:9px}
.b{position:relative;max-width:76%;padding:8px 13px;border-radius:19px;font-size:15px;line-height:1.38;background:var(--bub);color:var(--ink);white-space:pre-wrap;word-break:break-word}
.me .b{background:var(--ink);color:#fff}
.b.tl:before{content:"";position:absolute;bottom:0;left:-7px;width:20px;height:20px;background:var(--bub);border-bottom-right-radius:15px}
.b.tl:after{content:"";position:absolute;bottom:0;left:-10px;width:10px;height:20px;background:#fff;border-bottom-right-radius:10px}
.me .b.tl:before{left:auto;right:-7px;background:var(--ink);border-bottom-right-radius:0;border-bottom-left-radius:15px}
.me .b.tl:after{left:auto;right:-10px;border-bottom-right-radius:0;border-bottom-left-radius:10px}
.b.img{padding:0;background:none!important}.b.img img{display:block;max-width:220px;max-height:260px;border-radius:18px}
.b.card{cursor:pointer}.b .ql{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.04em;opacity:.72;margin:1px 0 4px}
.st{font-style:normal;font-size:10.5px;border:1px solid currentColor;border-radius:9px;padding:0 6px;line-height:16px}
.rc{font-size:11px;color:var(--ink-3);margin:3px 4px 0}
.stp{display:flex;gap:5px;margin:6px 0 2px;flex-wrap:wrap}.stp span{font-size:11px;color:var(--ink-3);align-self:center;margin-right:2px}
.stp button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:12px}.stp button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flash .b,.qi.flash{animation:fl 1.6s}@keyframes fl{0%,40%{box-shadow:0 0 0 3px rgba(13,13,13,.25)}100%{box-shadow:0 0 0 3px rgba(13,13,13,0)}}

/* composer */
.tray{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 2px;flex:none}.tray .tt{width:100%;font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;display:inline-flex;gap:5px;align-items:center}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.tagrow{padding:8px 14px 0;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex:none}
.tagrow b{font-weight:500;color:var(--ink);border:1px solid var(--ink);border-radius:12px;padding:1px 9px}.tagrow button{border:0;background:none;color:var(--ink-3);padding:0 4px}
.cmp{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 10px;flex:none}
.plus{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;padding:0;transition:transform .2s}
.plus svg{width:15px;height:15px;stroke:var(--ink-2);stroke-width:2;fill:none}.plus.on{transform:rotate(45deg)}

 ${editId?`<div class="tagrow"><b>메시지 수정 중</b>보낸 지 5분 안에만 고칠 수 있어요<button data-unedit aria-label="취소">✕</button></div>`:tag?`<div class="tagrow"><b>${CATS[tag]}</b>(으)로 보내요<button data-untag aria-label="취소">✕</button></div>`:""}
 <div class="cmp">${mode==="notice"?"":`<button class="plus${tray?" on":""}" data-tray aria-label="더보기">${IC.plus}</button>`}<div class="field"><textarea id="txt" rows="1" placeholder="${mode==="notice"?"모든 회원에게 공지 보내기":tag?"내용을 적어주세요":"메시지"}">${esc(draft)}</textarea><button class="send${draft.trim()?" on":""}" data-send aria-label="보내기">${IC.up}</button></div></div><input type="file" id="file" accept="image/*" hidden>`}

function qItem(x,admin){return `<div class="qi${flash===x.id?" flash":""}" data-goq="${x.id}"><div class="qm"><div class="k">${admin?esc(S.users[x.uid].name)+" · ":""}${CATS[x.cat]} · ${listT(x.at)}</div><div class="t">${esc(x.title)}</div>${admin?`<button class="trash${delC==="q:"+x.id?" on":""}" data-delq="${x.id}">${delC==="q:"+x.id?"한 번 더 누르면 삭제":"삭제"}</button>`:""}</div><div class="qs"><i class="dot lamp s-${x.st}"></i>${ST[x.st]}</div></div>`}
const legend=`<div class="qf" style="gap:12px;font-size:11.5px;color:var(--ink-2)">${Object.entries(ST).map(([k,v])=>`<span style="display:inline-flex;gap:5px;align-items:center"><i class="dot s-${k}"></i>${v}</span>`).join("")}</div>`;

/* ---------- user ---------- */
function userView(){const c=S.conv[S.me],nu=nUnread();
 if(uView==="home"){const l=last(c),ln=S.notices[S.notices.length-1];
  return `<div class="sh"><button class="ibtn x" data-close aria-label="닫기">${IC.x}</button><h2 class="lt">Messages</h2><small>문의와 공지를 한곳에서 받아요</small></div><div class="scroll" style="margin-top:10px">
  <div class="ci" data-uview="chat">${c.unU?`<i class="ud"></i>`:""}<span class="av s m">M</span><div class="cm"><div class="r1"><b class="nm">문의 · Master</b><span class="tm">${listT(l.at)}</span></div><div class="pv">${l.f==="u"?"나: ":""}${l.img?"사진":esc(l.t)}</div></div></div>
  <div class="ci" data-uview="notice">${nu?`<i class="ud"></i>`:""}<span class="av s vd">VD</span><div class="cm"><div class="r1"><b class="nm">공지 · VISUAL DEPT.</b><span class="tm">${ln?listT(ln.at):""}</span></div><div class="pv">${ln?esc(ln.t||("업데이트 · "+(ln.items||[])[0])):"아직 공지가 없어요"}</div></div></div></div>`}
 if(uView==="notice"){if(open)S.nRead[S.me]=Date.now();
  return `<div class="ch"><button class="ibtn bk" data-back aria-label="목록">${IC.back}</button><button class="ibtn x" data-close aria-label="닫기">${IC.x}</button><span class="av vd">VD</span><b class="nm">VISUAL DEPT. 공지</b><small>업데이트 소식이 이곳으로 와요</small></div>${bubbles(noticeMsgs(),"u",null)}<div class="ro">공지에는 답장할 수 없어요 · 문의는 ‘문의’ 메시지함에서 보내주세요</div>`}
 const my=S.inq.filter(x=>x.uid===S.me);if(open&&uTab==="chat")c.unU=0;
 return `<div class="ch"><button class="ibtn bk" data-back aria-label="목록">${IC.back}</button><button class="ibtn x" data-close aria-label="닫기">${IC.x}</button><span class="av m">M</span><b class="nm">Master</b><small>VISUAL DEPT. 운영자 · 보통 하루 안에 답장해요</small></div>
 <div class="seg2"><button data-utab="chat" class="${uTab==="chat"?"on":""}">채팅</button><button data-utab="list" class="${uTab==="list"?"on":""}">문의 내역</button></div>
 ${uTab==="chat"?bubbles(c.msgs,"u",c,`<div class="intro"><span class="av m big">M</span><p style="margin:10px 0 0">오류, 바라는 기능, 빼도 될 기능 —<br>무엇이든 편하게 보내주세요.<br><b>+</b> 에서 문의 유형을 고르면 <b>문의 내역</b>에서 처리 결과를 볼 수 있어요.<br>보낸 메시지는 눌러서 5분 안에 수정할 수 있어요.</p></div>`)+composer("user")
  :`${legend}<div class="scroll">${my.length?my.map(x=>qItem(x)).join(""):`<div class="empty">아직 문의가 없어요<br>채팅에서 + 를 눌러 유형을 고르고 보내면 여기에 기록돼요</div>`}</div>`}`}

/* ---------- admin ---------- */
function chatRows(){const ln=S.notices[S.notices.length-1];
 const pin=!q?`<div class="ci pin${aConv===NB?" on":""}" data-conv="${NB}"><span class="av s vd">VD</span><div class="cm"><div class="r1"><b class="nm">공지</b><span class="tm">${ln?listT(ln.at):""}</span></div><div class="pv">${ln?esc(ln.t||("업데이트 · "+(ln.items||[])[0])):"보낸 공지가 없어요"}</div></div></div>`:"";
 return pin+(Object.keys(S.users).filter(k=>S.users[k].name.includes(q)).sort((a,b)=>last(S.conv[b]).at-last(S.conv[a]).at).map(k=>{const c=S.conv[k],l=last(c),u=S.users[k];
 return `<div class="ci${aConv===k?" on":""}" data-conv="${k}">${c.unA?`<i class="ud"></i>`:""}<span class="av s">${esc(u.name.slice(-2))}</span><div class="cm"><div class="r1"><b class="nm">${esc(u.name)}</b><span class="tm">${l.at?listT(l.at):""}</span></div><div class="pv">${l.f==="a"?"나: ":""}${l.img?"사진":esc(l.t||"")}</div></div></div>`}).join("")||`<div class="empty">검색 결과가 없어요</div>`)}
function adminView(){if(open&&aConv&&aConv!==NB)S.conv[aConv].unA=0;const ks=Object.keys(S.users),un=ks.filter(k=>S.conv[k].unA).length,pend=S.inq.filter(x=>x.st==="new").length;
 const ql=S.inq.filter(x=>aF==="all"||x.st===aF);
 const side=`<div class="side"><div class="sh"><button class="ibtn x" data-close aria-label="닫기">${IC.x}</button><h2 class="lt">Messages</h2><small>회원 ${ks.length}명 · 안 읽은 대화 ${un}</small></div>
  <div class="seg2"><button data-atab="chats" class="${aTab==="chats"?"on":""}">대화</button><button data-atab="inq" class="${aTab==="inq"?"on":""}">문의 현황${pend?`<i>${pend}</i>`:""}</button></div>
  ${aTab==="chats"?`<input class="srch" id="srch" placeholder="이름 검색" value="${esc(q)}"><div class="scroll" id="clist">${chatRows()}</div>`:
  `<div class="qf">${[["all","전체"],...Object.entries(ST)].map(([k,v])=>`<button class="chip${aF===k?" on":""}" data-af="${k}">${k!=="all"?`<i class="dot s-${k}"></i>`:""}${v} ${k==="all"?S.inq.length:S.inq.filter(x=>x.st===k).length}</button>`).join("")}</div><div class="scroll">${ql.map(x=>qItem(x,true)).join("")||`<div class="empty">해당 문의가 없어요</div>`}</div>`}</div>`;
 let main;
 if(aConv===NB)main=`<div class="ch"><button class="ibtn bk" data-back aria-label="목록">${IC.back}</button><button class="ibtn x" data-close aria-label="닫기">${IC.x}</button><span class="av vd">VD</span><b class="nm">VISUAL DEPT. 공지</b><small>모든 회원의 공지 메시지함으로 보내져요 · 업데이트 노트도 자동으로 보내져요</small></div>${bubbles(noticeMsgs(),"n",null)}${composer("notice")}`;
 else if(aConv){const u=S.users[aConv],qs=S.inq.filter(x=>x.uid===aConv);
  main=`<div class="ch"><button class="ibtn bk" data-back aria-label="목록">${IC.back}</button><button class="ibtn x" data-close aria-label="닫기">${IC.x}</button><span class="av">${esc(u.name.slice(-2))}</span><b class="nm">${esc(u.name)}</b><small>${esc(u.mail)} · 문의 ${qs.length}건 · 확인 전 ${qs.filter(x=>x.st==="new").length}건</small></div>${bubbles(S.conv[aConv].msgs,"a",S.conv[aConv])}${composer("admin")}`}
 else main=`<div class="empty"><span class="av m big">M</span><p>왼쪽에서 대화를 고르세요<br>회원 말풍선을 누르면 처리 상태를 바꾸거나 삭제할 수 있어요</p></div>`;
 return `<div class="split">${side}<div class="main">${main}</div></div>`}

/* ---------- render & actions ---------- */
function render(keep){const m=P.querySelector(".msgs"),st=keep&&m?m.scrollTop:null;
 P.className="panel"+(open?" on":"")+(role==="admin"?" wide":"")+(role==="admin"&&aConv?" conv":"");
 P.innerHTML=role==="user"?userView():adminView();save();
 const m2=P.querySelector(".msgs"),f=flash&&P.querySelector(".flash");
 if(f)f.scrollIntoView({block:"center"});else if(m2)m2.scrollTop=st!=null?st:m2.scrollHeight;const tp=sel&&P.querySelector(".stp");if(tp)tp.scrollIntoView({block:"nearest"});
 if(flash)setTimeout(()=>{flash=null},1700);
 const fab=$("#fab");fab.classList.toggle("open",open);
 const n=role==="user"?S.conv[S.me].unU+nUnread():Object.values(S.conv).reduce((a,c)=>a+c.unA,0);fab.querySelector(".bd").textContent=!open&&n?n:"";
 document.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("on",b.dataset.role===role));const t=$("#txt");if(t)grow(t)}
const grow=t=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,110)+"px"};
const focusT=()=>{const t=$("#txt");if(t&&innerWidth>640){t.focus();t.setSelectionRange(t.value.length,t.value.length)}};
const findM=id=>{const c=curConv();return c&&c.msgs.find(m=>m.id===id)};
function push(m){const c=curConv();m.id=nid();c.msgs.push(m);if(m.f==="u")c.unA++;else c.unU++}
function send(){const t=draft.trim();if(!t)return;
 if(editId){const m=findM(editId);if(m&&Date.now()-m.at<EDIT){m.t=t;m.ed=1;if(m.q){const x=S.inq.find(z=>z.id===m.q);if(x)x.title=t.split("\n")[0].slice(0,48)}}editId=null;draft="";return render(true)}
 if(role==="admin"&&aConv===NB){S.notices.push({id:nid(),at:Date.now(),t});draft="";return render()}
 const m={f:role==="user"?"u":"a",t,at:Date.now()};
 if(m.f==="u"&&tag){const id="i"+m.at;S.inq.unshift({id,uid:S.me,cat:tag,title:t.split("\n")[0].slice(0,48),st:"new",at:m.at});m.q=id;tag=null}
 tray=false;push(m);draft="";render();focusT()}
function setSt(id,k){const x=S.inq.find(z=>z.id===id);if(!x||x.st===k)return;x.st=k;
 const c=S.conv[x.uid];c.msgs.push({id:nid(),f:"s",k,q:x.id,t:`‘${x.title}’ 문의가 ${STMSG[k]}`,at:Date.now()});c.unU++;sel=null;render()}
function delInq(id){const x=S.inq.find(z=>z.id===id);if(!x)return;S.inq=S.inq.filter(z=>z.id!==id);const c=S.conv[x.uid];c.msgs=c.msgs.filter(m=>m.q!==id)}
function readImg(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);r(cv.toDataURL("image/jpeg",.8))};im.src=fr.result};fr.readAsDataURL(f)})}

P.addEventListener("click",e=>{const g=s=>e.target.closest(s);let b;
 if(g("[data-close]")){open=false;return render()}
 if(b=g("[data-uview]")){uView=b.dataset.uview;uTab="chat";sel=null;editId=null;draft="";return render()}
 if(b=g("[data-utab]")){uTab=b.dataset.utab;tray=false;sel=null;return render()}
 if(b=g("[data-atab]")){aTab=b.dataset.atab;delC=null;return render()}
 if(b=g("[data-conv]")){if(aConv!==b.dataset.conv){aConv=b.dataset.conv;sel=null;delC=null;tray=false;draft="";editId=null}return render()}
 if(g("[data-back]")){if(role==="user")uView="home";else aConv=null;sel=null;editId=null;draft="";tray=false;return render()}
 if(g("[data-tray]")){tray=!tray;return render(true)}
 if(b=g("[data-cat]")){tag=tag===b.dataset.cat?null:b.dataset.cat;tray=false;render(true);return focusT()}
 if(g("[data-untag]")){tag=null;return render(true)}
 if(g("[data-unedit]")){editId=null;draft="";return render(true)}
 if(g("[data-photo]"))return $("#file").click();
 if(g("[data-send]"))return send();
 if(b=g("[data-st]"))return setSt(b.dataset.q,b.dataset.st);
 if(b=g("[data-edit]")){const m=findM(b.dataset.edit);if(m&&Date.now()-m.at<EDIT){editId=m.id;draft=m.t;tag=null;tray=false}sel=null;render(true);return focusT()}
 if(b=g("[data-del]")){const id=b.dataset.del;if(delC!==id){delC=id;return render(true)}const m=findM(id);if(m){if(m.q)delInq(m.q);else{const c=curConv();c.msgs=c.msgs.filter(z=>z.id!==id)}}delC=null;sel=null;return render(true)}
 if(b=g("[data-delq]")){e.stopPropagation();const id=b.dataset.delq;if(delC!=="q:"+id){delC="q:"+id;return render(true)}delInq(id);delC=null;return render(true)}
 if(b=g("[data-m]")){const id=b.dataset.m;sel=sel===id?null:id;delC=null;return render(true)}
 if(b=g("[data-goq]")){const x=S.inq.find(z=>z.id===b.dataset.goq);if(!x)return;sel=null;if(role==="user"&&uTab==="chat"){uTab="list";flash=x.id;return render()}flash=x.id;if(role==="user")uTab="chat";else{aConv=x.uid;aTab="chats"}return render()}
 if(b=g("[data-af]")){aF=b.dataset.af;return render()}});
P.addEventListener("input",e=>{if(e.target.id==="txt"){draft=e.target.value;grow(e.target);P.querySelector("[data-send]").classList.toggle("on",!!draft.trim())}
 if(e.target.id==="srch"){q=e.target.value.trim();$("#clist").innerHTML=chatRows()}});
P.addEventListener("keydown",e=>{if(e.target.id==="txt"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}});
P.addEventListener("change",async e=>{if(e.target.id==="file"&&e.target.files[0]){const img=await readImg(e.target.files[0]);tray=false;if(role==="admin"&&aConv===NB)return;push({f:role==="user"?"u":"a",t:"",img,at:Date.now()});render()}});
$("#fab").onclick=()=>{open=!open;if(open&&role==="user")uView="home";render()};
document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{role=b.dataset.role;open=true;uView="home";tray=false;tag=null;sel=null;delC=null;editId=null;draft="";render()});
$("#reset").onclick=()=>{try{localStorage.removeItem(KEY)}catch(_){}S=seed();role="user";open=false;uView="home";uTab="chat";aTab="chats";aConv=null;aF="all";tag=null;tray=false;sel=null;delC=null;editId=null;draft="";render()};
load();render();
</script></body></html>
