<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ARCHIVE">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<title>ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
body.noai .ai-only{display:none!important}
/* Layout: ZARA × iOS — Bodoni large titles over iOS grouped surfaces; sidebar on desktop, frosted tab bar on phone; sheets, banners and message-style translation bubbles */
:root{
  --bg:#f2f2f0; --surface:#ffffff; --surface-2:#f7f7f5; --ink:#0b0b0b; --ink-2:#6e6e73; --ink-3:#a1a1a6;
  --line:rgba(0,0,0,.08); --fill:rgba(118,118,128,.12); --sel:#0b0b0b; --on-sel:#ffffff;
  --glass:rgba(250,250,248,.72); --bubble:rgba(28,28,30,.78); --on-bubble:#ffffff; --scrim:rgba(0,0,0,.32); --bar:rgba(250,250,248,.8);
  --good:#2f7d4a; --warn:#b26b00; --bad:#c13b2e; --heat:#d9480f;
  --form:#ece9e3; --form-ink:#3a3a3a;
  --r:14px;
  --f-title:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hanken Grotesk","Helvetica Neue","Noto Sans KR",Arial,sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#1c1c1e;--surface-2:#232325;--ink:#f5f5f7;--ink-2:#98989d;--ink-3:#636366;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--sel:#f5f5f7;--on-sel:#000000;--glass:rgba(38,38,40,.72);--bubble:rgba(235,235,240,.86);--on-bubble:#000000;--scrim:rgba(0,0,0,.55);--bar:rgba(22,22,24,.8);--good:#4cc27a;--warn:#f0a43a;--bad:#ff6b5e;--heat:#ff8a4c;--form:#d9d6cf;--form-ink:#2a2a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--surface:#1c1c1e;--surface-2:#232325;--ink:#f5f5f7;--ink-2:#98989d;--ink-3:#636366;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--sel:#f5f5f7;--on-sel:#000000;--glass:rgba(38,38,40,.72);--bubble:rgba(235,235,240,.86);--on-bubble:#000000;--scrim:rgba(0,0,0,.55);--bar:rgba(22,22,24,.8);--good:#4cc27a;--warn:#f0a43a;--bad:#ff6b5e;--heat:#ff8a4c;--form:#d9d6cf;--form-ink:#2a2a2a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
[data-alt]{cursor:help}
button [data-alt],a [data-alt],label [data-alt]{cursor:inherit}

/* translation bubble (iMessage-style) */
#bubble{position:fixed;z-index:90;max-width:min(320px,calc(100vw - 24px));padding:7px 13px;border-radius:14px;background:var(--glass);color:var(--ink);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);box-shadow:0 8px 28px rgba(0,0,0,.14),inset 0 0 0 .5px var(--line);font-family:var(--f-ko);font-size:13.5px;font-weight:500;line-height:1.35;pointer-events:none;opacity:0;transform:translateY(4px) scale(.97);transform-origin:50% 100%;transition:opacity .14s ease,transform .18s cubic-bezier(.2,.9,.3,1.2)}
#bubble.on{opacity:1;transform:none}
#bubble.below{transform-origin:50% 0}

/* notification banners */
#banners{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:95;display:grid;gap:8px;width:min(420px,calc(100% - 24px));pointer-events:none}
.banner{pointer-events:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start;padding:11px 14px;border-radius:20px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);box-shadow:0 10px 40px rgba(0,0,0,.18),inset 0 0 0 .5px var(--line);border:0;text-align:left;width:100%;transform:translateY(-130%);opacity:0;transition:transform .42s cubic-bezier(.2,.9,.25,1.15),opacity .3s}
.banner.on{transform:none;opacity:1}
.banner .bh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.banner b{display:block;font-size:14.5px;margin-top:1px;font-family:var(--f-ko);font-weight:600}
.banner p{margin:1px 0 0;font-size:13.5px;font-family:var(--f-ko);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.mark{font-family:var(--f-title);font-size:28px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase;padding:0 8px;margin:0;font-weight:400}
.mark span{display:block;font-family:var(--f-ui);font-size:10px;letter-spacing:.24em;margin-top:8px;font-weight:600;color:var(--ink-2)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px;border-radius:10px;text-align:left;font-size:15px;font-weight:500}
.nav button svg{width:22px;height:22px;flex:none}
.nav button[aria-current="page"]{background:var(--sel);color:var(--on-sel)}
.nav .dot{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--heat);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.side .foot{margin-top:auto;display:grid;gap:10px;padding:0 6px}
.main{min-width:0;padding-inline:clamp(16px,3.4vw,44px);padding-block:22px 120px}
.topbar,.tabbar{display:none}
.large{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 18px;position:relative}
.largeR{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-left:auto;max-width:100%;align-self:stretch}
.largeR > :last-child:not(.hdrlock){margin-top:auto}
.largeR > .toolbar{justify-content:flex-end;margin:0}
@media (max-width:560px){.hdrlock{padding:6px 10px}.hdrlock > span{display:none}.largeR{align-items:flex-start;margin-left:0}.largeR > .toolbar{justify-content:flex-start}}
.chip svg,.hue svg{width:14px;height:14px;vertical-align:-2px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px}
.toolbar .search{flex:1 1 220px}
.toolbar > *{flex-shrink:0}.toolbar > .search{flex-shrink:1}
.large h1{font-family:var(--f-title);font-weight:400;font-size:clamp(24px,2.6vw,34px);line-height:1;margin:2px 0 0;text-transform:uppercase;letter-spacing:-.035em}
.large .sub{color:var(--ink-2);font-size:13px;margin-top:8px;max-width:66ch;font-family:var(--f-ko)}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.section{margin-top:26px}
.section > .cap,.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 4px 8px}
.status{font-size:13px;color:var(--ink-2);font-family:var(--f-ko)}

/* controls */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px;max-width:100%}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.segwrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:8px 10px;min-width:0;flex:1}
.search svg{width:16px;height:16px;color:var(--ink-2);flex:none}
.search input{border:0;background:none;outline:none;width:100%;font-size:15px;min-width:0}
.pill{border:0;background:var(--sel);color:var(--on-sel);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.pill.soft{background:var(--fill);color:var(--ink)}
.pill.sm{padding:6px 12px;font-size:13px}
.pill:disabled{opacity:.4;cursor:default}
.pill svg{width:15px;height:15px}
.iconbtn{border:0;background:var(--fill);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:17px;height:17px}
.iconbtn:disabled{opacity:.35}
.autotog{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);font-family:var(--f-ko)}.autotog .switch{transform:scale(.82);transform-origin:right center}
.iconbtn.sm{width:28px;height:28px;font-size:13px;font-weight:700}.ordbtns{display:flex;gap:4px}
.iconbtn.saved{background:var(--sel);color:var(--on-sel)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;max-width:100%}
.chip{border:0;background:var(--surface);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);box-shadow:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;border:0;background:none;width:100%;text-align:left;text-decoration:none;position:relative}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--ink-2);font-family:var(--f-ko)}
.row .chev{color:var(--ink-3);flex:none}
select.ios,input.ios,textarea.ios{border:0;background:var(--fill);border-radius:8px;padding:8px 10px;font-size:15px;width:100%;min-width:0}
textarea.ios{min-height:80px;resize:vertical;font-family:var(--f-ko)}
.formrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;padding:10px 16px}
.formrow + .formrow{border-top:1px solid var(--line)}
.formrow > label{font-size:14px;color:var(--ink-2)}
.switch{position:relative;width:51px;height:31px;flex:none;border:0;border-radius:16px;background:var(--fill);transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--fill);white-space:nowrap}
.badge.dark{background:var(--sel);color:var(--on-sel)}
.badge.heat{background:var(--heat);color:#fff}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;font-size:14px}
.brief{background:var(--surface);border-radius:var(--r);padding:16px;font-family:var(--f-ko);font-size:14px;line-height:1.75;white-space:pre-wrap;min-height:60px}
.brief .muted{color:var(--ink-2)}
.empty{background:var(--surface);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2);font-family:var(--f-ko);font-size:14px}

/* runway */
.brandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.btile{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;border:0;text-align:left;display:flex;flex-direction:column;gap:18px;min-height:132px;position:relative;min-width:0}
.btile .bn{font-family:var(--f-title);font-size:18px;letter-spacing:-.03em;line-height:1.02;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.btile .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.btile .star{position:absolute;top:6px;right:6px}
.star{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink-3);cursor:pointer;flex:none;border:0;background:none;padding:0;transition:background .15s,color .15s}
.star:hover{background:var(--fill);color:var(--ink)}
.star.on{color:#d9a400}
.star svg{width:19px;height:19px}
.btile .bn{padding-right:26px}
.letter{grid-column:1/-1;font-family:var(--f-title);font-size:22px;margin:12px 4px 0}
.season-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.notecard{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.notecard p{margin:0;font-family:var(--f-ko);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.calc{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.calc .mo{font-family:var(--f-title);font-size:21px;letter-spacing:-.03em;text-transform:uppercase}
.calc.next{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sitegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sitecard{position:relative;background:var(--surface);border-radius:var(--r);min-width:0;transition:box-shadow .15s}
.sitecard:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sitelink{display:grid;gap:6px;padding:14px 16px;text-decoration:none;color:inherit;height:100%}
.sitetop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sitetop b{font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.sitedesc{font-family:var(--f-ko);font-size:14px;font-weight:500;color:var(--ink);opacity:.78}
.sitehost{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-top:2px}
.sitecard.muted .sitetop b,.sitecard.muted .sitedesc{color:var(--ink-3)}
.sitedel{position:absolute;right:10px;bottom:10px;width:30px;height:30px;opacity:.45;transition:opacity .15s}
.sitecard:hover .sitedel,.sitedel:focus-visible,.sitedel[data-armed]{opacity:1}
@media (hover:none){.sitedel{opacity:.7}}
.csgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.csgrid > .cscard:last-child{grid-column:1/-1}
.csgrid.cmp{display:block}
.cscard{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0;border:0;text-align:left;display:block;width:100%}
.cbar{display:flex;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.cbar i{display:block;min-width:2px}
.crows,.krows{display:grid;gap:2px;margin-top:12px}
.crow,.krow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 52px 58px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.crow{grid-template-columns:22px minmax(0,1.3fr) minmax(60px,1fr) 52px 58px}
.crow:last-child,.krow:last-child{border-bottom:0}
.sw2{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);display:inline-block}
.sw2.sm{width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cn,.kn{display:grid;font-weight:600;font-size:14px;min-width:0;font-family:var(--f-ko)}
.cn small,.kn small{font-weight:500;font-size:11.5px;color:var(--ink-2);font-family:var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbarmini,.kbar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.cbarmini b,.kbar b{display:block;height:100%;border-radius:4px}
.kbar b{background:var(--ink)}
.cv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.dl{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.dl.up{color:var(--good)}.dl.down{color:var(--bad)}
.csmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--ink-2);font-family:var(--f-ko)}
.neunote{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;font-family:var(--f-ko);color:var(--ink-2);margin:-2px 0 10px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}.neunote span{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}.neunote i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}.neunote em{font-style:normal;flex-basis:100%}
.cscmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cscol{cursor:pointer;display:grid;gap:8px;align-content:start}
.cscol:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.mini{display:grid;gap:4px;font-size:12.5px;font-family:var(--f-ko)}
.mini span{display:flex;align-items:center;gap:6px}.mini span b{margin-left:auto;font-variant-numeric:tabular-nums}
.mini i{width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex:none}
.mini.cats{padding-top:8px;border-top:1px solid var(--line)}
.cstab{min-width:0}.cstab td,.cstab th{padding:8px 10px}
#csSearch:not(:empty){margin-bottom:12px}
@media (max-width:900px){.csgrid{grid-template-columns:minmax(0,1fr)}.cscmp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.crow{grid-template-columns:22px minmax(0,1fr) 48px 52px}.krow{grid-template-columns:minmax(0,1fr) 48px 52px}.crow .cbarmini,.krow .kbar{display:none}}
.badge.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.row.muted .t,.row.muted .s{color:var(--ink-3)}
.rwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.rwlook{border:0;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:2/3;background:var(--surface-2);display:block;max-width:100%}
.rwlook img{width:100%;height:100%;object-fit:cover;display:block}
.rwlook.ph{display:grid;place-items:center;font-size:11px;color:var(--ink-2);text-decoration:none;padding:6px;text-align:center}

/* feed & trends */
.feeditem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:14px 16px;position:relative}
.feeditem + .feeditem::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.feeditem .src{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.feeditem h3{margin:4px 0 3px;font-size:16px;font-weight:600;font-family:var(--f-ko);line-height:1.35}
.feeditem p{margin:0;font-size:13.5px;color:var(--ink-2);font-family:var(--f-ko)}
.feeditem .acts{display:flex;flex-direction:column;gap:6px}
.feeditem.new{animation:flash 2.4s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--heat) 14%,transparent)}100%{background:transparent}}
.trendgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tcard{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}

.heatbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}

/* fitting */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,420px);gap:16px;align-items:start}

.stage{background:var(--surface);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.figbox{border-radius:10px;overflow:hidden;background:var(--surface-2);width:100%;height:clamp(420px,calc(100vh - 330px),820px);display:flex;align-items:center;justify-content:center;padding:14px 0}

.handle{fill:#fff;stroke:#111;stroke-width:2;cursor:grab}
.layertabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.swrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);padding:0;flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.wheelwrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center}
.wheel{position:relative;width:170px;height:170px;touch-action:none}

.wheel .knob{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}

input[type=range]{width:100%}
.aibox{display:grid;gap:8px}
.aibox .hist{display:flex;gap:6px;flex-wrap:wrap}

/* plan */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi b{display:block;font-family:var(--f-title);font-size:24px;letter-spacing:-.03em;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.mix{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);margin:10px 0}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:80px;margin-top:10px}
.months i{display:block;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}
.months span{font-size:10px;color:var(--ink-2);text-align:center}
.months i{position:relative}.months i[data-v]::after{content:attr(data-v);position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);font-size:9.5px;font-style:normal;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.months.bars{margin-top:22px}
.mtab{width:100%;min-width:0;border-collapse:collapse;margin-top:12px;font-size:13px}
.mtab th,.mtab td{padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtab th{font-size:10.5px;background:none;padding-top:0}
.mtab tr.tot td{font-weight:600;border-bottom:0}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--surface)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.st{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--fill)}
.st.Confirmed{background:var(--sel);color:var(--on-sel)}

/* archive */
.capture{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;margin-bottom:18px}
.pastezone{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:8px;place-items:center;text-align:center;border:1.5px dashed var(--ink-3);min-height:150px;cursor:pointer}

.kbd{font-family:var(--f-mono);font-size:12px;background:var(--fill);padding:2px 6px;border-radius:5px}
.codebox{font-family:var(--f-mono);font-size:11px;background:var(--fill);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;max-height:70px}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.board{border:0;background:var(--surface);border-radius:var(--r);padding:10px;text-align:left;display:grid;gap:8px;min-width:0}

.dropover{box-shadow:inset 0 0 0 2px var(--heat)!important;background:color-mix(in srgb,var(--heat) 10%,var(--surface))!important}
.fmain{min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}.crumbs .sp{flex:1}.crumbs .link{text-decoration:none}
.dropstrip{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--ink-3);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--ink-2);font-family:var(--f-ko);font-size:13.5px;cursor:pointer}
.dropstrip svg{width:18px;height:18px;flex:none}.dropstrip.drag{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.huebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-2px 0 14px}
.hue{border:0;background:var(--surface);border-radius:999px;padding:4px 9px 4px 5px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.catbar .hue.cat{padding:5px 11px;font-weight:600;color:var(--ink);font-family:var(--f-ko);font-size:12.5px}.catbar .hue.cat.on{background:var(--sel);color:var(--on-sel);box-shadow:none}.catbar .hue.cat.on span{color:inherit;opacity:.7}.hue.cat span{color:var(--ink-3);font-weight:500;margin-left:2px}
.hue i{width:16px;height:16px;border-radius:50%;background:var(--h);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}.hue.on{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.subfolders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.ftile{border:0;background:var(--surface);border-radius:var(--r);padding:8px;text-align:left;display:grid;gap:6px;min-width:0}
.ftile .cov{aspect-ratio:4/3;border-radius:9px;background:var(--surface-2);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;overflow:hidden;max-width:100%}
.ftile .cov > *{width:100%;height:100%;object-fit:cover;display:block;background:var(--fill)}
.ftile b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ftile small{color:var(--ink-2);font-size:12px}
.agrid{columns:var(--col,220px);column-gap:10px}
.item.sel{box-shadow:0 0 0 2.5px var(--ink)}
.selbox{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);box-shadow:0 1px 4px rgba(0,0,0,.3);opacity:0;transition:opacity .15s;padding:0}
.item:hover .selbox,.item.sel .selbox{opacity:1}.selbox[aria-pressed="true"]{background:var(--sel);border-color:var(--on-sel)}
.selbox[aria-pressed="true"]::after{content:"";display:block;width:6px;height:10px;border:solid var(--on-sel);border-width:0 2px 2px 0;transform:translate(7px,3px) rotate(45deg)}
@media (hover:none){.selbox{opacity:1}}
.bulkbar{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);box-shadow:0 10px 40px rgba(0,0,0,.18),inset 0 0 0 .5px var(--line);max-width:calc(100% - 32px);flex-wrap:wrap}
.viewer{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;grid-template-columns:56px minmax(0,1fr) 56px 340px;grid-template-rows:auto minmax(0,1fr);gap:0 8px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer .vtop{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding-bottom:8px}
.viewer .vstage{grid-column:2;display:grid;place-items:center;min-height:0;overflow:hidden}
.viewer .vstage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.viewer .vnav{align-self:center;border:0;background:var(--fill);width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1}
.viewer .vnav:disabled{opacity:.2}.viewer .prev{grid-column:1;grid-row:2}.viewer .next{grid-column:3;grid-row:2}
.viewer .vside{grid-column:4;grid-row:2;background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;overflow:auto;min-height:0}
.viewer .vtitle{font-weight:600;font-size:16px}
@media (max-width:900px){.arch{grid-template-columns:minmax(0,1fr)}.ftree{position:static;display:flex;overflow-x:auto;max-height:none;padding:4px}.ftree .frow{width:auto;flex:none;padding-left:10px!important}.viewer{grid-template-columns:44px minmax(0,1fr) 44px;grid-template-rows:auto minmax(0,1fr) auto;overflow:auto}.viewer .vside{grid-column:1/-1;grid-row:3;margin-top:10px}}
.item{break-inside:avoid;background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:10px;display:block;width:100%;position:relative}
.item .open{border:0;background:none;padding:0;text-align:left;width:100%;display:block}
.item img,.item .svgbox{display:block;width:100%}
.item .svgbox svg{display:block;width:100%;height:auto}
.item .ph{aspect-ratio:4/3;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-family:var(--f-title);font-size:22px;text-transform:uppercase;line-height:1.05}
.item .ph small{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;margin-bottom:4px;opacity:.75}
.item .body{padding:10px 12px 12px;display:grid;gap:5px}
.item h4{margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere;font-family:var(--f-ko)}
.item p{margin:0;font-size:12.5px;color:var(--ink-2);font-family:var(--f-ko);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .quick{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.item:hover .quick,.item:focus-within .quick{opacity:1}
@media (hover:none){.item .quick{opacity:1}}
.quick .iconbtn{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);width:32px;height:32px}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.chipcol{border:0;border-radius:12px;aspect-ratio:1;padding:8px;display:flex;align-items:flex-end;font-size:11px;font-weight:600;font-family:var(--f-mono);max-width:100%}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:50%;top:50%;width:min(640px,calc(100% - 32px));max-height:min(86vh,860px);overflow:auto;background:var(--bg);border-radius:18px;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.sheet.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.sheet .sh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}

.sheet h2{font-family:var(--f-title);font-weight:400;font-size:28px;letter-spacing:-.03em;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.textbtn{border:0;background:none;font-weight:600;font-size:15px;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);color:var(--on-sel);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;font-family:var(--f-ko);max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.banner{cursor:pointer}
.banner .bacts{display:flex;gap:8px;margin-top:8px}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:24px}
#gate form{width:min(360px,100%);display:grid;gap:14px;text-align:center}

#gate.shake form{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sheet.wide{width:min(980px,calc(100% - 32px))}
.lsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lscard{border:0;background:var(--surface);border-radius:var(--r);padding:0;text-align:left;overflow:hidden;display:grid;min-width:0}
.lsimg{aspect-ratio:3/4;background:var(--surface-2);position:relative;display:grid;place-items:center;overflow:hidden;max-width:100%}

.lsbody{padding:12px 14px 14px;display:grid;gap:4px}

.lsnums{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:6px 0 2px;font-size:11px;color:var(--ink-2)}

.edgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.edimg{display:grid;place-items:center;aspect-ratio:3/4;background:var(--surface);border-radius:var(--r);border:1.5px dashed var(--ink-3);cursor:pointer;overflow:hidden;text-align:center;padding:10px;max-width:100%}
.edimg img{width:100%;height:100%;object-fit:contain}
.mtable td{padding:4px 6px}
.mtable .cell{width:100%;min-width:56px;border:0;background:var(--fill);border-radius:6px;padding:6px 8px;font-size:13.5px}
.mtable .cell.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.edgrid{grid-template-columns:minmax(0,1fr)}}

<script>
/* ===== Supabase adapter — gives the app the same data API it had inside Claude ===== */
const CFG=window.ARCHIVE_CONFIG||{};
const SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
const SHARED=new Set(["feed","trends","channels","meta","seasonstats","nfmap"]);
let UID=null,UEMAIL="";
const stores={};
const tableOf=c=>SHARED.has(c)?"shared_docs":"docs";
function snapFor(c,q,changes){
  const st=stores[c];let docs=[...st.map.entries()].map(([id,d])=>({id,d}));
  if(q.of)docs.sort((a,b)=>{const x=a.d?.[q.of],y=b.d?.[q.of];return (x>y?1:x<y?-1:0)*(q.dir==="desc"?-1:1)});
  if(q.lim)docs=docs.slice(0,q.lim);
  const mk=({id,d})=>({id,exists:d!==undefined,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});
  const ds=docs.map(mk);
  return {docs:ds,size:ds.length,empty:!ds.length,metadata:{},docChanges:()=>(changes||[]).filter(ch=>ch.type==="removed"||docs.some(x=>x.id===ch.id)).map(ch=>({type:ch.type,doc:mk({id:ch.id,d:st.map.get(ch.id)})}))};
}
function emit(c,changes){const st=stores[c];st.listeners.forEach(l=>{try{if(l.doc){if(changes.some(ch=>ch.id===l.doc)){const d=st.map.get(l.doc);l.fn({id:l.doc,exists:d!==undefined,data:()=>d})}}else l.fn(snapFor(c,l.q,changes))}catch(e){console.error(e)}})}
function store(c){
  if(stores[c])return stores[c];const st=stores[c]={map:new Map(),listeners:new Set(),loaded:null};
  st.loaded=(async()=>{
    const all=[];for(let from=0;;from+=1000){let q=SB.from(tableOf(c)).select("id,data").eq("collection",c);if(!SHARED.has(c))q=q.eq("owner",UID);const {data,error}=await q.range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break}
    all.forEach(r=>st.map.set(r.id,r.data));
    SB.channel(`c-${c}-${Math.random().toString(36).slice(2)}`).on("postgres_changes",{event:"*",schema:"public",table:tableOf(c),filter:`collection=eq.${c}`},p=>{
      if(p.eventType==="DELETE"){const id=p.old?.id;if(!SHARED.has(c)&&p.old?.owner&&p.old.owner!==UID)return;if(id&&st.map.has(id)){st.map.delete(id);emit(c,[{type:"removed",id}])}return}
      const row=p.new;if(!row||(!SHARED.has(c)&&row.owner!==UID))return;const prev=st.map.get(row.id);if(JSON.stringify(prev)===JSON.stringify(row.data))return;
      st.map.set(row.id,row.data);emit(c,[{type:prev===undefined?"added":"modified",id:row.id}]);
    }).subscribe();
  })();
  return st;
}
async function write(c,id,data){
  const st=store(c);await st.loaded;const clean=JSON.parse(JSON.stringify(data));
  const row={collection:c,id,data:clean,updated_at:new Date().toISOString()};if(!SHARED.has(c))row.owner=UID;
  const {error}=await SB.from(tableOf(c)).upsert(row,{onConflict:SHARED.has(c)?"collection,id":"owner,collection,id"});if(error)throw {code:"unavailable",message:error.message};
  const had=st.map.has(id);st.map.set(id,clean);emit(c,[{type:had?"modified":"added",id}]);
}
function docRef(c,id){return {id,path:`${c}/${id}`,
  get:async()=>{const st=store(c);await st.loaded;const d=st.map.get(id);return {id,exists:d!==undefined,data:()=>d}},
  set:data=>write(c,id,data),
  update:async data=>{const st=store(c);await st.loaded;return write(c,id,{...(st.map.get(id)||{}),...data})},
  delete:async()=>{const st=store(c);await st.loaded;let q=SB.from(tableOf(c)).delete().eq("collection",c).eq("id",id);if(!SHARED.has(c))q=q.eq("owner",UID);const {error}=await q;if(error)throw {code:"unavailable",message:error.message};if(st.map.has(id)){st.map.delete(id);emit(c,[{type:"removed",id}])}},
  onSnapshot:(fn,err)=>{const st=store(c),l={doc:id,fn};st.loaded.then(()=>{st.listeners.add(l);const d=st.map.get(id);fn({id,exists:d!==undefined,data:()=>d})}).catch(e=>err&&err(e));return ()=>st.listeners.delete(l)}}}
function query(c,q={}){return {path:c,
  orderBy:(f,dir="asc")=>query(c,{...q,of:f,dir}),limit:n=>query(c,{...q,lim:n}),where:()=>query(c,q),
  get:async()=>{const st=store(c);await st.loaded;return snapFor(c,q,[])},
  onSnapshot:(fn,err)=>{const st=store(c),l={q,fn};st.loaded.then(()=>{st.listeners.add(l);fn(snapFor(c,q,[...st.map.keys()].map(id=>({type:"added",id}))))}).catch(e=>err&&err(e));return ()=>st.listeners.delete(l)},
  doc:id=>docRef(c,id||crypto.randomUUID()),
  add:async data=>{const id=crypto.randomUUID();await write(c,id,data);return docRef(c,id)}}}
const DB={collection:c=>query(c),doc:p=>{const i=p.indexOf("/");return docRef(p.slice(0,i),p.slice(i+1))}};

/* images: private per-user storage, shown through short-lived signed links */
const PLACEHOLDER="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const SIGNED=new Map(),toSign=new Set();let signTimer=null;
function queueSign(id){if(toSign.has(id))return;toSign.add(id);clearTimeout(signTimer);signTimer=setTimeout(async()=>{const ids=[...toSign];toSign.clear();
  const {data}=await SB.storage.from("archive").createSignedUrls(ids,60*60*24*7);(data||[]).forEach(d=>{if(d.signedUrl)SIGNED.set(d.path,d.signedUrl)});
  const busy=document.activeElement?.closest?.("input,textarea,select")||document.querySelector("#sheet.on");if(!busy&&typeof render==="function")render();if(typeof renderViewer==="function"&&document.querySelector("#viewer"))renderViewer();},40)}
window.__OFFLINE_BLOBS=new Proxy({},{get:(_,id)=>{if(typeof id!=="string")return undefined;if(SIGNED.has(id))return SIGNED.get(id);if(UID)queueSign(id);return PLACEHOLDER}});
async function shrink(blob){
  if(!blob.type.startsWith("image/")||blob.type==="image/gif"||blob.type==="image/svg+xml")return blob;
  const url=URL.createObjectURL(blob),im=new Image();await new Promise(r=>{im.onload=r;im.onerror=r;im.src=url});URL.revokeObjectURL(url);if(!im.naturalWidth)return blob;
  const max=1800,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));if(sc===1&&blob.size<900e3)return blob;
  const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  const keepAlpha=blob.type==="image/png";return await new Promise(r=>c.toBlob(r,keepAlpha?"image/png":"image/jpeg",.86));
}
const ASSETS={
  upload:async blob=>{const b=await shrink(blob);if(b.size>20e6)throw {code:"too_large"};const ext=(b.type.split("/")[1]||"bin").replace("jpeg","jpg");const path=`${UID}/${crypto.randomUUID()}.${ext}`;
    const {error}=await SB.storage.from("archive").upload(path,b,{contentType:b.type,upsert:false});if(error)throw {code:"upstream_error",message:error.message};
    const {data}=await SB.storage.from("archive").createSignedUrl(path,60*60*24*7);if(data?.signedUrl)SIGNED.set(path,data.signedUrl);return {id:path,url:data?.signedUrl||"",sizeBytes:b.size,contentType:b.type}},
  delete:async id=>{await SB.storage.from("archive").remove([id]);SIGNED.delete(id);return {deleted:true}},
  list:async()=>({assets:[],usage:{}})
};
const DL={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return {status:"saved"}}};
window.claude={use:async n=>({db:DB,assets:ASSETS,downloads:DL}[n]||null)};


/* ================= i18n + bubble ================= */

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function t(en,ko){if(ko==null||ko===""||ko===en)return esc(en);const a=lang==="en"?en:ko,b=lang==="en"?ko:en;return `<span data-alt="${esc(b)}">${esc(a)}</span>`}
const tx=(en,ko)=>lang==="en"?en:(ko||en);
const BLOB=id=>(window.__OFFLINE_BLOBS&&window.__OFFLINE_BLOBS[id])||"/_blob/"+id;
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const bubble=$("#bubble");let bubTarget=null,bubTimer=null;
function showBubble(el){
  const txt=el.getAttribute("data-alt");if(!txt)return;bubTarget=el;bubble.textContent=txt;bubble.classList.remove("below");bubble.style.left="0px";bubble.style.top="0px";
  const r=el.getBoundingClientRect(),bw=bubble.offsetWidth,bh=bubble.offsetHeight;
  let x=r.left+r.width/2-bw/2;x=Math.max(10,Math.min(innerWidth-bw-10,x));
  let y=r.top-bh-8;if(y<8){y=r.bottom+8;bubble.classList.add("below")}
  bubble.style.left=x+"px";bubble.style.top=y+"px";
  bubble.classList.add("on");
}
function hideBubble(){bubble.classList.remove("on");bubTarget=null}
document.addEventListener("pointerover",e=>{if(e.pointerType==="touch")return;const el=e.target.closest("[data-alt]");if(el&&el!==bubTarget){clearTimeout(bubTimer);bubTimer=setTimeout(()=>showBubble(el),120)}});
document.addEventListener("pointerout",e=>{if(e.pointerType==="touch")return;const el=e.target.closest("[data-alt]");if(el&&!el.contains(e.relatedTarget)){clearTimeout(bubTimer);hideBubble()}});
document.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;const el=e.target.closest("[data-alt]");if(!el)return;clearTimeout(bubTimer);showBubble(el);bubTimer=setTimeout(hideBubble,1700)});
addEventListener("scroll",hideBubble,{passive:true,capture:true});

let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2000)}
function lum(hex){const n=parseInt(String(hex).replace("#","").padEnd(6,"0").slice(0,6),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255}
const won=n=>"₩"+Math.round(n).toLocaleString("ko-KR");
const wonShort=n=>{const f=(v,u)=>(v>=100?Math.round(v).toLocaleString("ko-KR"):v.toFixed(1).replace(/\.0$/,""))+u;if(lang==="ko")return n>=1e8?f(n/1e8,"억"):n>=1e4?f(n/1e4,"만"):won(n);return n>=1e6?"₩"+f(n/1e6,"M"):n>=1e3?"₩"+f(n/1e3,"K"):won(n)};
function ago(ms){if(!ms)return "";const m=Math.round((Date.now()-ms)/60000);if(m<1)return tx("now","방금");if(m<60)return tx(m+"m ago",m+"분 전");const h=Math.round(m/60);if(h<24)return tx(h+"h ago",h+"시간 전");return tx(Math.round(h/24)+"d ago",Math.round(h/24)+"일 전")}
function langSeg(){return `<div class="seg" role="group" aria-label="Language"><button data-lang="en" aria-pressed="${lang==="en"}">EN</button><button data-lang="ko" aria-pressed="${lang==="ko"}">한국어</button></div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;try{localStorage.setItem("atelier.lang",lang)}catch(_){}renderShell();render();repaintBanners();if(agentOpen)renderAgent();});

/* title/body/labels may be plain strings or [en, ko] pairs; pairs follow the language switch live */
const L2=v=>Array.isArray(v)?tx(v[0],v[1]):v;
function paintBanner(b){const {title,body,actions}=b._spec;b.innerHTML=`<span style="min-width:0"><span class="bh"><span>ARCHIVE</span><span>${esc(tx("now","지금"))}</span></span><b>${esc(L2(title))}</b>${body?`<p>${esc(L2(body))}</p>`:""}${actions?`<span class="bacts">${actions.map((a,i)=>`<button type="button" class="pill ${a.primary?"":"soft"} sm" data-bact="${i}">${esc(L2(a.label))}</button>`).join("")}</span>`:""}</span>`}
function notify({title,body,go,actions,sticky}){
  const host=$("#banners");while(host.children.length>=3)host.firstChild.remove();
  const b=document.createElement("div");b.className="banner";b.setAttribute("role","status");b.tabIndex=0;b._spec={title,body,actions};paintBanner(b);
  host.appendChild(b);requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add("on")));
  const kill=()=>{b.classList.remove("on");setTimeout(()=>b.remove(),400)};const timer=sticky?null:setTimeout(kill,4500);
  b.onclick=e=>{const ab=e.target.closest("[data-bact]");clearTimeout(timer);kill();if(ab){actions[+ab.dataset.bact].fn?.()}else go&&go()};
}
const repaintBanners=()=>$$("#banners .banner").forEach(b=>b._spec&&paintBanner(b));

/* sortable lists & grids: drag a [data-sortgrip] handle (mouse or touch), or focus it and use arrow keys.
   container [data-sortlist="<key>"] (+ data-sortgrid for 2-D grids), items [data-sortid]; SORT_SAVE[key](ids) persists. */
const SORT_SAVE={};
let sDrag=null;
const sortItems=c=>[...c.children].filter(x=>x.dataset&&x.dataset.sortid!=null);
document.addEventListener("pointerdown",e=>{const gp=e.target.closest("[data-sortgrip]");if(!gp||e.button>0)return;const item=gp.closest("[data-sortid]");const list=item&&item.parentElement;if(!list||!list.dataset.sortlist)return;e.preventDefault();
  sDrag={item,list,sx:e.clientX,sy:e.clientY,id:e.pointerId,moved:false,grid:list.hasAttribute("data-sortgrid")};item.classList.add("dragging");try{gp.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener("pointermove",e=>{if(!sDrag||e.pointerId!==sDrag.id)return;const {item,list,grid}=sDrag;const dx=e.clientX-sDrag.sx,dy=e.clientY-sDrag.sy;if(Math.abs(dx)+Math.abs(dy)>3)sDrag.moved=true;
  item.style.transform=`translate(${grid?dx:0}px,${dy}px)`;
  const others=sortItems(list).filter(x=>x!==item);let ref=null,found=false;
  for(const o of others){const r=o.getBoundingClientRect();
    if(grid){if(e.clientY>=r.top&&e.clientY<=r.bottom&&e.clientX>=r.left-6&&e.clientX<=r.right+6){found=true;ref=e.clientX<r.left+r.width/2?o:o.nextElementSibling;break}}
    else if(e.clientY<r.top+r.height/2){found=true;ref=o;break}}
  if(!grid&&!found){found=true;ref=null}
  if(found){if(ref===item)ref=item.nextElementSibling;const cur=item.nextElementSibling;if(cur!==ref){const before=item.getBoundingClientRect();item.style.transform="";const b0=item.getBoundingClientRect();list.insertBefore(item,ref);const b1=item.getBoundingClientRect();sDrag.sx+=b1.left-b0.left;sDrag.sy+=b1.top-b0.top;void before;item.style.transform=`translate(${grid?e.clientX-sDrag.sx:0}px,${e.clientY-sDrag.sy}px)`}}
  const sc=document.scrollingElement;if(e.clientY<60)sc.scrollTop-=8;else if(e.clientY>innerHeight-60)sc.scrollTop+=8});
const sDrop=async e=>{if(!sDrag||e.pointerId!==sDrag.id)return;const {item,list,moved}=sDrag;sDrag=null;item.classList.remove("dragging");item.style.transform="";if(moved){const f=SORT_SAVE[list.dataset.sortlist.split(":")[0]];if(f)await f(sortItems(list).map(x=>x.dataset.sortid),list.dataset.sortlist)}};
document.addEventListener("pointerup",sDrop);document.addEventListener("pointercancel",sDrop);
document.addEventListener("click",e=>{if(e.target.closest("[data-sortgrip]")){e.preventDefault();e.stopPropagation()}},true);
document.addEventListener("keydown",async e=>{const gp=e.target.closest&&e.target.closest("[data-sortgrip]");if(!gp)return;const back=e.key==="ArrowUp"||e.key==="ArrowLeft",fwd=e.key==="ArrowDown"||e.key==="ArrowRight";if(!back&&!fwd)return;e.preventDefault();
  const item=gp.closest("[data-sortid]"),list=item.parentElement;const sib=back?item.previousElementSibling:item.nextElementSibling;if(!sib||sib.dataset.sortid==null)return;
  if(back)list.insertBefore(item,sib);else list.insertBefore(sib,item);gp.focus();const f=SORT_SAVE[list.dataset.sortlist.split(":")[0]];if(f)await f(sortItems(list).map(x=>x.dataset.sortid),list.dataset.sortlist)});
const GRIP_SVG=`<svg viewBox="0 0 16 12" aria-hidden="true"><path d="M1 2h14M1 6h14M1 10h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
/* channels */
SORT_SAVE.chan=async ids=>{const list=ids.map(id=>channels.find(c=>c.id===id)).filter(Boolean);if(!list.length)return;
  const g=list[0].group||"source";const base=g==="media"?0:100;const changed=[];list.forEach((x,k)=>{if(x.order!==base+k){x.order=base+k;changed.push(x)}});channels.sort((a,b)=>(a.order??99)-(b.order??99));
  if(db){for(const x of changed){try{await db.collection("channels").doc(x.id).update({order:x.order})}catch(_){toast(tx("Couldn't save order","순서 저장 실패"));break}}}};
document.addEventListener("click",async e=>{
  const fk=e.target.closest("[data-fk]");if(fk){tr.kind=fk.dataset.fk;renderTrendsBody();return}
  const fc=e.target.closest("[data-fchan]");if(fc){tr.chan=fc.dataset.fchan;renderTrendsBody();return}
  if(e.target.closest("[data-bloom]")){tr.bloom=!tr.bloom;renderTrendsBody();return}
  const sf=e.target.closest("[data-savefeed]");if(sf){const f=feed.find(x=>x.id===sf.dataset.savefeed);if(f)saveArchive({title:f.title,board:"Clippings",kind:"Article",tags:f.tags||[],note:`${f.summary||""}\n${f.source||""}`,link:f.url,site:f.source});return}
  const st=e.target.closest("[data-savetrend]");if(st){const x=trends.central[+st.dataset.savetrend];saveArchive({title:`${x.ko} (${x.en})`,board:"Trends",kind:"Trend",tags:x.outlets||[],note:`${x.why}\n${(x.links||[]).join("\n")}`,link:(x.links||[])[0]});return}
  const tg=e.target.closest("[data-track]");if(tg){const c=channels.find(x=>x.id===tg.dataset.track);if(!c)return;const v=!c.track;c.track=v;tg.setAttribute("aria-checked",v);if(db){try{await db.collection("channels").doc(c.id).update({track:v})}catch(_){toast(tx("Couldn't save","저장 실패"))}}return}
  const dc=e.target.closest("[data-delchan]");if(dc){if(!dc.dataset.armed){dc.dataset.armed=1;dc.style.background="var(--bad)";dc.style.color="#fff";toast(tx("Tap again to remove","한 번 더 누르면 삭제"));setTimeout(()=>{delete dc.dataset.armed;dc.style.background="";dc.style.color=""},3000);return}
    if(db){try{await db.collection("channels").doc(dc.dataset.delchan).delete();toast(tx("Removed","삭제됨"))}catch(_){toast(tx("Couldn't remove","삭제 실패"))}}else{channels=channels.filter(c=>c.id!==dc.dataset.delchan);renderTrendsBody()}return}
  if(e.target.closest("[data-addchan]"))openAddChannel();
});

function smooth(pts,closed=true,k=.18){
  const n=pts.length,P=i=>pts[(i+n)%n];let d=`M${f2(P(0)[0])},${f2(P(0)[1])}`;const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);const s1=p1[2]||(!closed&&i===0),s2=p2[2]||(!closed&&i===n-2);
    const c1=s1?[p1[0],p1[1]]:[p1[0]+(p2[0]-p0[0])*k,p1[1]+(p2[1]-p0[1])*k],c2=s2?[p2[0],p2[1]]:[p2[0]-(p3[0]-p1[0])*k,p2[1]-(p3[1]-p1[1])*k];
    d+=` C${f2(c1[0])},${f2(c1[1])} ${f2(c2[0])},${f2(c2[1])} ${f2(p2[0])},${f2(p2[1])}`}
  return d+(closed?" Z":"");
}

function vmap(y){const p=model.pts,fy=p.face[1],ny=p.neck[1],sy=(p.sL[1]+p.sR[1])/2,hy=(p.hL[1]+p.hR[1])/2,ky=(p.kL[1]+p.kR[1])/2,ay=(p.aL[1]+p.aR[1])/2;
  const A=[[90,fy],[165,ny],[190,sy],[470,hy],[705,ky],[925,ay]];
  if(y<=90)return fy+(y-90)*(model.faceR/46);
  for(let i=0;i<A.length-1;i++){const [a0,b0]=A[i],[a1,b1]=A[i+1];if(y<=a1)return b0+(y-a0)*(b1-b0)/(a1-a0)}

function hmapper(){const p=model.pts,g=geo(),sT=g.s/75,sH=Math.abs(p.hR[0]-p.hL[0])/110,sLg=(Math.abs(p.kR[0]-p.kL[0])/68+Math.abs(p.aR[0]-p.aL[0])/44)/2,sF=model.faceR/46;
  return (x,y)=>{if(y<=140)return p.face[0]+(x-300)*sF;let k;if(y<=380)k=sT;else if(y<=470)k=sT+(sH-sT)*(y-380)/90;else if(y<=520)k=sH;else k=sH+(sLg-sH)*Math.min(1,(y-520)/185);const c=y<=180?p.face[0]+(g.cx-p.face[0])*Math.min(1,(y-140)/40):g.cx;return c+(x-300)*k}}

function mannequinSVG(){

  g+=`<path d="M${mp(219,466)} L${mp(235,469)}" ${seam}/><path d="M${mp(381,466)} L${mp(365,469)}" ${seam}/>`;
  g+=`<path d="M${mp(279,160)} Q${mp(300,168)} ${mp(321,160)}" ${seam}/><path d="M${mp(244,412)} Q${mp(300,426)} ${mp(356,412)}" ${seam}/>`;

function hem(g,len,kind){
  const leg=g.kY-g.hY,shin=g.aY-g.kY;
  if(kind==="dress"||kind==="skirt")return len==="short"?g.hY+leg*.5:len==="mid"?g.kY+shin*.35:g.aY-shin*.04;
  if(kind==="outer")return len==="short"?g.hY+g.torso*.12:len==="mid"?g.hY+leg*.8:g.kY+shin*.55;
  if(kind==="pants")return len==="short"?g.hY+leg*.35:len==="mid"?g.kY+shin*.5:g.aY+shin*.03;

function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return [f(5)*255,f(3)*255,f(1)*255]}

function extractPalette(img){const c=document.createElement("canvas"),s=64;c.width=s;c.height=s;const x=c.getContext("2d");x.drawImage(img,0,0,s,s);const d=x.getImageData(0,0,s,s).data,bins=new Map();for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const k=(d[i]>>5)<<10|(d[i+1]>>5)<<5|(d[i+2]>>5);const v=bins.get(k)||[0,0,0,0];v[0]+=d[i];v[1]+=d[i+1];v[2]+=d[i+2];v[3]++;bins.set(k,v)}
  return [...bins.values()].sort((a,b)=>b[3]-a[3]).slice(0,14).map(v=>[v[0]/v[3],v[1]/v[3],v[2]/v[3]]).reduce((acc,c)=>{if(acc.length<5&&acc.every(a=>Math.hypot(a[0]-c[0],a[1]-c[1],a[2]-c[2])>40))acc.push(c);return acc},[]).map(c=>rgb2hex(...c))}

/* AI tagging queue — one at a time to stay within limits */
const tagQ=[];let tagging=false;

async function runTagQ(){if(tagging)return;tagging=true;const sample=await getSample();let ok=false;try{ok=!!(sample&&(await sample.limits()).images)}catch(e){}
  while(tagQ.length){const {id,blob}=tagQ.shift();if(!ok)continue;try{const r=await sample.json(`This is a fashion reference image saved by a womenswear designer. Return ONLY JSON: {"title":"short Korean title, max 18 chars","tags":["5-8 short lowercase English tags: garment type, silhouette, fabric/texture, details, mood, colour names"],"cats":["every category clearly shown, from: dress, top, knit, jacket, coat, skirt, pants, bag, shoes, acc, fabric, print, detail"],"note":"one Korean sentence on what is useful in this reference"}`,{images:[blob],modelTier:"quick"});
    const a=archive.find(x=>x.id===id);if(!a)continue;const upd={tags:[...new Set([...(a.tags||[]),...(r.tags||[]).slice(0,8)])]};const okc=(r.cats||[]).filter(k=>ACATS.some(c=>c[0]===k));upd.cats=okc.length?okc:["other"];if(r.title&&/Pasted image|붙여넣은 이미지|^image|^IMG|^\d/.test(a.title||""))upd.title=r.title;if(r.note&&!a.note)upd.note=r.note;await db.collection("archive").doc(id).update(upd)}catch(e){if(e?.code==="rate_limited"){await new Promise(r=>setTimeout(r,8000))}}}
  tagging=false}
async function copyItemImage(a){

}

/* layered PSD from transparent PNG layers (bottom first), RLE-compressed */
const PSD_LAYER_NAMES=["시트 · 표","도식화 FRONT","도식화 BACK","치수선","완제품 예시"];
async function layersToPsdBlob(urls,names){
  const imgs=await Promise.all(urls.map(u=>new Promise((res,rej)=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>res(im);im.onerror=()=>rej(new Error("layer"));im.src=u})));
  const w=imgs[0].naturalWidth,h=imgs[0].naturalHeight;
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d",{willReadFrequently:true});
  /* PackBits a channel (stride 4 within RGBA) into rows; returns {rows:Uint8Array, counts:Uint16 lengths} */
  const scratch=new Uint8Array(w*2+16);
  const packPlane=(px,c)=>{const outs=[];const counts=new Array(h);let total=0;const row=new Uint8Array(w);
    for(let y=0;y<h;y++){let base=y*w*4+c;for(let x=0;x<w;x++,base+=4)row[x]=px[base];
      let o=0,i=0;while(i<w){let j=i;while(j+1<w&&row[j+1]===row[i]&&j-i<127)j++;
        if(j>i){scratch[o++]=257-(j-i+1);scratch[o++]=row[i];i=j+1}
        else{j=i;while(j+1<w&&row[j+1]!==row[j]&&j-i<127)j++;if(j+1===w&&j-i<127)j=w-1;const len=j>i?j-i+1:1;scratch[o++]=len-1;for(let k=0;k<len;k++)scratch[o++]=row[i+k];i+=len}}
      outs.push(scratch.slice(0,o));counts[y]=o;total+=o}
    return {outs,counts,total}};
  const rleChan=(px,c)=>{const {outs,counts,total}=packPlane(px,c);const b=new Uint8Array(2+2*h+total);const dv=new DataView(b.buffer);dv.setUint16(0,1);let o=2;for(const n of counts){dv.setUint16(o,n);o+=2}for(const r of outs){b.set(r,o);o+=r.length}return b};
  const parts=[];const be=(n,bytes)=>{const b=new Uint8Array(bytes);const dv=new DataView(b.buffer);if(bytes===2)dv.setInt16(0,n);else dv.setUint32(0,n>>>0);return b};
  const ascii=s=>new TextEncoder().encode(s);
  const recs=[],chans=[];const comp=new Uint8ClampedArray(w*h*4);
  const tmp=document.createElement("canvas");tmp.width=w;tmp.height=h;const tx2=tmp.getContext("2d");tx2.fillStyle="#fff";tx2.fillRect(0,0,w,h);
  imgs.forEach((im,li)=>{cx.clearRect(0,0,w,h);cx.drawImage(im,0,0,w,h);const px=cx.getImageData(0,0,w,h).data;tx2.drawImage(im,0,0,w,h);
    const enc=[[-1,rleChan(px,3)],[0,rleChan(px,0)],[1,rleChan(px,1)],[2,rleChan(px,2)]];
    const name=(names&&names[li])||PSD_LAYER_NAMES[li]||("Layer "+(li+1));
    let nm=[...ascii(name.replace(/[^\x20-\x7e]/g,"_"))].slice(0,255);let pn=[nm.length,...nm];while(pn.length%4)pn.push(0);
    const u=[];for(const ch of name){const c=ch.charCodeAt(0);u.push(c>>8,c&255)}let body=[...be(name.length,4),...u];while(body.length%4)body.push(0);
    const luni=[...ascii("8BIMluni"),...be(body.length,4),...body];
    const extra=[...be(0,4),...be(0,4),...pn,...luni];
    const rec=[...be(0,4),...be(0,4),...be(h,4),...be(w,4),...be(4,2)];
    enc.forEach(([id,d])=>{rec.push(...be(id,2),...be(d.length,4))});
    rec.push(...ascii("8BIMnorm"),255,0,0,0,...be(extra.length,4),...extra);
    recs.push(new Uint8Array(rec));enc.forEach(([,d])=>chans.push(d))});
  const cp=tx2.getImageData(0,0,w,h).data;
  const sum=a=>a.reduce((s,x)=>s+x.length,0);
  let liLen=2+sum(recs)+sum(chans);const pad=liLen%2;liLen+=pad;
  /* merged image: RLE R,G,B,A planes */
  const mp=[0,1,2,3].map(c=>packPlane(cp,c));
  const merged=new Uint8Array(2+2*h*4+mp.reduce((s,x)=>s+x.total,0));{const dv=new DataView(merged.buffer);dv.setUint16(0,1);let o=2;for(const x of mp)for(const n of x.counts){dv.setUint16(o,n);o+=2}for(const x of mp)for(const r of x.outs){merged.set(r,o);o+=r.length}}
  const hdr=new Uint8Array([...ascii("8BPS"),0,1,0,0,0,0,0,0,0,4,...be(h,4),...be(w,4),0,8,0,3]);
  parts.push(hdr,be(0,4),be(0,4),be(4+liLen+4,4),be(liLen,4),be(imgs.length,2),...recs,...chans);if(pad)parts.push(new Uint8Array(1));parts.push(be(0,4),merged);
  return new Blob(parts,{type:"image/vnd.adobe.photoshop"});
}

document.addEventListener("change",e=>{if(e.target.id==="agentFile"){addAttFiles(e.target.files);e.target.value="";$("#agentPick").hidden=true}});
document.addEventListener("paste",e=>{if(!e.target.closest?.("#agentPanel"))return;const files=[...(e.clipboardData?.files||[])];if(files.some(f=>f.type.startsWith("image/"))){e.preventDefault();e.stopImmediatePropagation();addAttFiles(files)}},true);
document.addEventListener("dragover",e=>{if(!e.target.closest?.("#agentPanel"))return;if([...(e.dataTransfer?.types||[])].includes("Files")){e.preventDefault();e.stopImmediatePropagation();$("#agentPanel").classList.add("dropping")}},true);
document.addEventListener("dragleave",e=>{if(e.target.id==="agentPanel")$("#agentPanel").classList.remove("dropping")},true);
document.addEventListener("drop",e=>{if(!e.target.closest?.("#agentPanel"))return;$("#agentPanel").classList.remove("dropping");const fs=e.dataTransfer?.files;if(fs&&fs.length){e.preventDefault();e.stopImmediatePropagation();addAttFiles(fs)}},true);

/* ================= ACCOUNT + BACKUP + BOOT ================= */
let started=false,recovering=false;
function startApp(){
  if(started)return;started=true;$("#gate").hidden=true;$("#app").hidden=false;document.body.classList.add("noai");
  renderShell();render();startLive().then(ensureDefaults);
  setInterval(()=>{const el=$("#updLine");if(el)el.innerHTML=updLine()},60000);
  setTimeout(checkBackup,4000);
}
async function ensureDefaults(){try{if(!db)return;const d=await db.doc("prefs/setup").get();if(d.exists)return;const fs=await db.collection("folders").get();folders=fs.docs.map(x=>({id:x.id,...x.data()}));if(folders.length){await db.doc("prefs/setup").set({at:Date.now()});return}
  await folderIdFor("Inbox");const fab=await folderIdFor("Fabric Library");for(const n of ["Check & Tweed","Knit & Stripe","Satin · Sheer · Lace"])await folderIdFor(n,fab);
  const dir=await folderIdFor("Season Direction");await folderIdFor("Colour Stories",dir);for(const n of ["Looks","Runway","Clippings"])await folderIdFor(n);
  await db.doc("prefs/setup").set({at:Date.now()})}catch(e){console.warn(e)}}
async function lockNow(){await SB.auth.signOut();location.reload()}
const gMsg=(m,err)=>{$("#gateErr").textContent=err?m:"";$("#gateMsg").textContent=err?"":m};
const here=()=>location.origin+location.pathname;
function signedIn(u){UID=u.id;UEMAIL=u.email||"";startApp()}
$("#gateForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("#gateEmail").value.trim(),pw=$("#gatePw").value;
  if(recovering){const {data,error}=await SB.auth.updateUser({password:pw});if(error)return gMsg(error.message,1);recovering=false;gMsg("비밀번호를 바꿨어요.");if(data?.user)signedIn(data.user);return}
  gMsg("로그인 중…");const {data,error}=await SB.auth.signInWithPassword({email,password:pw});
  if(error){gMsg(/confirm/i.test(error.message)?"가입 확인 메일의 링크를 먼저 눌러주세요.":"이메일 또는 비밀번호가 맞지 않아요.",1);const g=$("#gate");g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake");return}
  signedIn(data.user)});
$("#gateUp").onclick=async()=>{const email=$("#gateEmail").value.trim(),pw=$("#gatePw").value;if(!email||pw.length<6)return gMsg("이메일과 6자 이상 비밀번호를 입력하세요.",1);
  const {data,error}=await SB.auth.signUp({email,password:pw,options:{emailRedirectTo:here()}});if(error)return gMsg(error.message,1);
  if(data.session)signedIn(data.user);else gMsg("확인 메일을 보냈어요. 메일의 링크를 누르면 바로 시작됩니다.")};
$("#gateForgot").onclick=async()=>{const email=$("#gateEmail").value.trim();if(!email)return gMsg("이메일을 먼저 입력하세요.",1);
  const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:here()});gMsg(error?error.message:"비밀번호 재설정 메일을 보냈어요.",!!error)};
SB.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY"){recovering=true;$("#gate").hidden=false;$("#app").hidden=true;$("#gateEmail").value=session?.user?.email||"";$("#gatePw").autocomplete="new-password";$("#gateIn").textContent="새 비밀번호 저장";gMsg("새 비밀번호를 입력하세요.");return}
  if(session&&!started&&!recovering)signedIn(session.user)});
(async()=>{if(!CFG.supabaseUrl||/YOUR_/.test(CFG.supabaseUrl)){gMsg("config.js에 Supabase 주소와 키를 먼저 넣어주세요.",1);return}
  const {data:{session}}=await SB.auth.getSession();if(session&&!recovering)signedIn(session.user);else setTimeout(()=>$("#gateEmail")?.focus(),50)})();

/* daily backup */
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
let backupInfo=null;
async function checkBackup(){
  if(db){try{const s=await db.doc("prefs/backup").get();backupInfo=s.exists?s.data():null}catch(e){}}
  let snooze="";try{snooze=localStorage.getItem("archive.backupSnooze")||""}catch(e){}
  const last=backupInfo?.lastDay||(()=>{try{return localStorage.getItem("archive.lastBackup")}catch(e){return null}})();
  if(last===today()||snooze===today())return;
  notify({title:["Back up today's work?","오늘 작업을 백업할까요?"],body:last?[`Last backup: ${last}. Saves boards, line sheet, channels and looks to a file and a cloud copy.`,`마지막 백업: ${last}. 보드·라인시트·채널·룩을 파일과 클라우드 사본으로 저장합니다.`]:["Saves boards, line sheet, channels and looks to a file and a cloud copy.","보드·라인시트·채널·룩을 파일과 클라우드 사본으로 저장합니다."],sticky:true,
    actions:[{label:["Back up now","지금 백업"],primary:true,fn:backupNow},{label:["Tomorrow","내일 다시"],fn:()=>{try{localStorage.setItem("archive.backupSnooze",today())}catch(e){}}}]});
}
function backupData(){return {app:"ARCHIVE",version:1,createdAt:new Date().toISOString(),archive,plan,channels,favorites,trends,look}}
async function backupNow(){
  const day=today(),data=backupData();let file=false,cloud=false;
  if(dl){try{await dl.save({filename:`archive-backup-${day}.json`,data:new Blob([JSON.stringify(data)],{type:"application/json"})});file=true}catch(e){}}
  if(db){try{await db.doc("backups/"+day).set({createdAt:Date.now(),archive:archive.map(({svg,...r})=>r),plan,channels,favorites});cloud=true}catch(e){}
    try{await db.doc("prefs/backup").set({lastDay:day,at:Date.now(),file,cloud});backupInfo={lastDay:day}}catch(e){}}
  try{localStorage.setItem("archive.lastBackup",day)}catch(e){}
  notify({title:file||cloud?["Backup saved","백업 완료"]:["Backup didn't finish","백업이 완료되지 않았습니다"],body:file||cloud?[[file?"file downloaded":"",cloud?"cloud copy":""].filter(Boolean).join(" · "),[file?"파일 저장":"",cloud?"클라우드 사본":""].filter(Boolean).join(" · ")]:["Open this page in claude.ai to back up.","claude.ai에서 열어야 백업할 수 있습니다."]});
}
async function restoreFrom(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast(tx("That isn't a backup file","백업 파일이 아닙니다"));return}
  if(data?.app!=="ARCHIVE"){toast(tx("That isn't an ARCHIVE backup","ARCHIVE 백업 파일이 아닙니다"));return}
  if(!db){toast(tx("Not available in the free version.","무료 버전에서는 사용할 수 없어요."));return}
  let n=0;const have={archive:new Set(archive.map(a=>a.id)),plan:new Set(plan.map(p=>p.id)),channels:new Set(channels.map(c=>c.id))};
  for(const col of ["archive","plan","channels"]){for(const d of data[col]||[]){if(!d.id||have[col].has(d.id))continue;const {id,...rest}=d;try{await db.collection(col).doc(id).set(rest);n++}catch(e){}}}
  toast(tx(`Restored ${n} missing items`,`빠진 항목 ${n}개를 복원했습니다`));
}
document.addEventListener("click",e=>{
  if(!e.target.closest("[data-settings]"))return;
  openSheet(t("Backup & account","백업 · 계정"),`<div class="group">
    <button class="row" id="stBackup"><div class="grow"><div class="t">${t("Back up now","지금 백업")}</div><div class="s">${esc(backupInfo?.lastDay?tx(`Last: ${backupInfo.lastDay}`,`마지막: ${backupInfo.lastDay}`):tx("Not backed up yet","아직 백업 없음"))}</div></div>${IC.down}</button>
    <label class="row" for="stRestore" style="cursor:pointer"><div class="grow"><div class="t">${t("Restore from backup file","백업 파일로 복원")}</div><div class="s">${esc(tx("Adds back anything missing; never overwrites.","빠진 항목만 되살리고 덮어쓰지 않습니다."))}</div></div>${IC.chev}</label><input type="file" id="stRestore" accept="application/json,.json" hidden>
    <button class="row" id="stLock"><div class="grow"><div class="t">${t("Sign out","로그아웃")}</div><div class="s">${esc(UEMAIL)}</div></div>${IC.chev}</button></div>
   <p class="status">${esc(tx("Your data is already saved continuously; backups are an extra copy. Images stay in the app's storage and are referenced by ID in the file.","데이터는 이미 계속 저장되고 있고, 백업은 추가 사본입니다. 이미지는 앱 저장소에 남고 파일에는 ID로 기록됩니다."))}</p>`);
  $("#stBackup").onclick=()=>{closeSheet();backupNow()};$("#stLock").onclick=lockNow;$("#stRestore").onchange=ev=>{const f=ev.target.files[0];if(f){closeSheet();restoreFrom(f)}};
});
