name: Developer chat

# Picks up requests from the 개발자 room in the app (master only) and lets Claude make the change.
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a little late)
  workflow_dispatch: {}

concurrency:
  group: dev-chat
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: q
        run: node scripts/dev-chat.mjs check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: steps.q.outputs.has == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - if: steps.q.outputs.has == 'true'
        run: node scripts/dev-chat.mjs run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
