name: Digest preview

on:
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/digest-preview.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Save a short status note
        if: always()
        run: |
          [ -d status ] || exit 0
          cp -r status /tmp/st
          git config user.name "collector" && git config user.email "collector@users.noreply.github.com"
          git fetch -q origin collector-status || true
          if git checkout -q -B collector-status origin/collector-status 2>/dev/null; then git clean -fdq; else git checkout -q --orphan collector-status; git rm -rqf . ; git clean -fdq; fi
          cp /tmp/st/* . ; git add -A ; git commit -qm "status" || exit 0 ; git push -q origin collector-status
