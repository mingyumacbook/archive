name: Probe data
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/probe-data.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: |
          mkdir -p /tmp/o && cp -r probe-out/* /tmp/o/
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-out-data && git rm -rqf . && cp -r /tmp/o/* . && git add -A && git commit -qm probe && git push -f origin probe-out-data
