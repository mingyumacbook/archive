name: Draft link probe
on:
  push:
    branches: [draft-probe]
    paths: [probe/input.json, probe/probe.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe/probe.mjs
      - run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git add probe/output.json && git commit -m "probe output [skip ci]" && git push
