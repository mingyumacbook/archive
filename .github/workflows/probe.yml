name: Draft link probe
on:
  push:
    branches: [draft-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe/probe.mjs
      - uses: actions/upload-artifact@v4
        with: { name: probe-output, path: probe/output.json }
